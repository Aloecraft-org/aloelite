[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aloelite"
version = "0.3.1rc1"
description = "Aloelite SQLite Filesystem"
readme = "README.md"
authors = [
    {name = "Michael Godfrey", email = "michael@aloecraft.org"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "cryptography",
    "pydantic",
    "pyyaml",
    "msgpack",
    "flask",         # or fastapi + uvicorn
]

[project.optional-dependencies]
fuse = [
    "pyfuse3",
    "trio",
]
test = [
    "pytest",
]
lint = [
    "ruff==0.15.8",
]

[project.scripts]
aloelite = "aloelite.cli:main"
aloelite-fuse = "aloelite.fuse:main"
aloelite-web = "manager.web:main"
aloelite-admin = "aloelite.admin:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aloelite*", "manager*"]

[tool.setuptools.package-data]
aloelite = ["config/*.yaml", "sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
# `manager` carries its own test module alongside the code it covers; naming both
# roots keeps a bare `pytest` equivalent to what CI runs.
testpaths = ["tests", "manager"]

[tool.ruff]
target-version = "py311"
# line-length is ruff's default 88, left implicit so `format` and `check` (E501)
# can never disagree about it.

# The gate covers what ships and what tests it. `script/` is dev tooling and
# `notebook/` is scratch; neither is packaged, and gating them would block the
# repo on churn nobody consumes.
extend-exclude = ["script", "notebook"]

[tool.ruff.lint]
# Enforced core. Deliberately narrow: every rule here is either a correctness
# check or mechanically fixable, so the gate stays green without argument.
#   E  pycodestyle    F  pyflakes    I  import sorting    C4  comprehensions
# Considered and not yet enabled -- each is worth doing as its own pass:
#   B    (47 hits, 34 of them raise-without-from)
#   UP   (56 hits, mostly redundant quoted annotations)
#   SIM  (12 hits, includes the unclosed handle in pin.py)
#   RUF  (38 hits)
select = ["E", "F", "I", "C4"]

[tool.ruff.lint.per-file-ignores]
# Package roots re-export their public surface; those imports are the point.
"__init__.py" = ["F401"]
