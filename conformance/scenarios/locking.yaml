# ACC-6..11. The point of pinning these now is ACC-8: the lock row carries
# read_count and write_count, and they are RECORDED BUT NOT ENFORCED. Read on
# its own, that schema looks like an invitation to implement shared reads. It
# is not — it forward-provisions a future policy without committing to one.
# These scenarios pin the policy that actually holds today, so a port cannot
# mistake the reservation for a specification.
scenarios:
  - scenario: a-write-descriptor-excludes-another-mounts-writer
    requirements: [ACC-6, ACC-7]
    harness: two_mounts_one_volume
    description: >
      Locks are exclusive in this iteration. A second mount opening the same
      entry for writing is refused while the first holds it.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: second
        raises: lock_held

  - scenario: an-exclusive-write-lock-also-excludes-atomic-writes
    requirements: [ACC-6, ACC-7, IO-2]
    harness: two_mounts_one_volume
    description: >
      Exclusion is a property of the entry, not of the API shape used to reach
      it: a held descriptor blocks the whole-content operations too, or the
      lock would be trivially bypassable.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: write_all
        args: {path: /contended.txt, data: {utf8: "bypass"}}
        via: second
        raises: lock_held
      - op: truncate
        args: {path: /contended.txt, size: 0}
        via: second
        raises: lock_held

  - scenario: a-write-lock-excludes-another-mounts-remove
    requirements: [ACC-6, ACC-7, ACC-11]
    harness: two_mounts_one_volume
    description: >
      A lock has to guard EXISTENCE, not only bytes. Removing an entry another
      mount is actively writing discards that writer's work, and neither side
      sees an error: the writer's close commits to a node with no placement.
      Exclusion that covers write_all but not remove is bypassable by anyone
      willing to delete first.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: remove
        args: {path: /contended.txt}
        via: second
        raises: lock_held

  - scenario: a-write-lock-excludes-another-mounts-move
    requirements: [ACC-6, ACC-7, ACC-11]
    harness: two_mounts_one_volume
    description: >
      Relocating a locked entry is refused at the entry itself. This is also
      what a future WebDAV class 2 frontend needs: RFC 4918 does not permit
      MOVE of a locked resource by a principal without the token.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: move
        args: {from: /contended.txt, to: /moved.txt}
        via: second
        raises: lock_held

  - scenario: a-write-lock-excludes-another-mounts-metadata-write
    requirements: [ACC-6, ACC-7, ACC-11, NODE-6]
    harness: two_mounts_one_volume
    description: >
      set_metadata replaces the NODE-6 map WHOLESALE, so an unguarded write
      from another mount erases annotations the lock holder is relying on.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: set_metadata
        args: {path: /contended.txt, metadata: {k: v}}
        via: second
        raises: lock_held

  - scenario: a-recursive-remove-is-refused-by-a-lock-deep-in-the-subtree
    requirements: [ACC-6, ACC-7, ACC-11]
    harness: two_mounts_one_volume
    description: >
      DESTRUCTION IS CHECKED TRANSITIVELY. remove_recursive archives every
      member of the subtree, so a lock anywhere below the root covers something
      the statement would destroy. An implementation that checks only the root
      passes the simple cases and still silently discards a deep writer's work.
    steps:
      - op: create_container
        args: {path: /a}
      - op: create_container
        args: {path: /a/b}
      - op: create_entry
        args: {path: /a/b/deep.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /a/b/deep.txt, mode: truncate}
        via: first
        bind: writer
      - op: remove_recursive
        args: {path: /a}
        via: second
        raises: lock_held
      - op: exists
        args: {path: /a/b/deep.txt}
        via: first
        expect: true

  - scenario: moving-an-ancestor-of-a-locked-node-is-permitted
    requirements: [ACC-7, ACC-11]
    harness: two_mounts_one_volume
    description: >
      The deliberate BOUNDARY of the rule above, pinned so a port does not
      "helpfully" tighten it. Relocation is checked at the locked node itself,
      not transitively: moving an ancestor changes the locked node's path but
      neither its content nor its existence. Checking ancestors would make an
      exclusive write lock behave like a lock on every directory above it, and
      one open file would freeze a whole tree.
    steps:
      - op: create_container
        args: {path: /a}
      - op: create_entry
        args: {path: /a/f.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /a/f.txt, mode: truncate}
        via: first
        bind: writer
      - op: move
        args: {from: /a, to: /moved}
        via: second
      - op: exists
        args: {path: /moved/f.txt}
        via: second
        expect: true

  - scenario: aborting-a-write-releases-the-lock
    requirements: [ACC-7, ACC-9, CV-3]
    harness: two_mounts_one_volume
    description: >
      An abort must free the entry as completely as a close does. If it did
      not, the safe way to discard a partial write would be to strand the lock
      and leave the resource permanently unwritable — worse than the partial
      commit it was meant to avoid. The other mount must find the ORIGINAL
      bytes, not the aborted ones.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: write
        args: {fd: {ref: writer}, data: {utf8: "abandoned"}}
      - op: write_all
        args: {path: /contended.txt, data: {utf8: "blocked"}}
        via: second
        raises: lock_held
      - op: abort
        args: {fd: {ref: writer}}
        via: first
      - op: read_all
        args: {path: /contended.txt}
        via: second
        expect: {utf8: "original"}
      - op: write_all
        args: {path: /contended.txt, data: {utf8: "now permitted"}}
        via: second
      - op: read_all
        args: {path: /contended.txt}
        via: second
        expect: {utf8: "now permitted"}

  - scenario: a-standalone-lock-outlives-the-descriptor-that-used-it
    requirements: [ACC-6, ACC-7, ACC-11]
    harness: two_mounts_one_volume
    description: >
      THE DISTINCTION BETWEEN A MINTED AND A SUPPLIED LOCK. open_write given an
      existing lock must not release it on close: the lock's lifetime belongs
      to whoever took it. A protocol whose LOCK, PUT and UNLOCK are separate
      requests would otherwise be unprotected between them, and a second
      writer could slip in after the first PUT closed.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: lock
        args: {path: /contended.txt, ttl_ms: 60000}
        via: first
        bind: held
      - op: open_write
        args: {path: /contended.txt, mode: truncate, lock: {ref: held.id}}
        via: first
        bind: writer
      - op: write
        args: {fd: {ref: writer}, data: {utf8: "first request"}}
      - op: close
        args: {fd: {ref: writer}}
        via: first
      - op: write_all
        args: {path: /contended.txt, data: {utf8: "interloper"}}
        via: second
        raises: lock_held
      - op: unlock
        args: {lock: {ref: held.id}}
        via: first
      - op: write_all
        args: {path: /contended.txt, data: {utf8: "now permitted"}}
        via: second
      - op: read_all
        args: {path: /contended.txt}
        via: second
        expect: {utf8: "now permitted"}

  - scenario: a-minted-lock-is-still-released-on-close
    requirements: [ACC-7]
    harness: two_mounts_one_volume
    description: >
      The other half of the same rule, pinned so an implementation adding
      supplied locks does not accidentally make every write leak one:
      open_write WITHOUT a token owns its lock and gives it back at close.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: write
        args: {fd: {ref: writer}, data: {utf8: "mine"}}
      - op: close
        args: {fd: {ref: writer}}
        via: first
      - op: write_all
        args: {path: /contended.txt, data: {utf8: "permitted"}}
        via: second

  - scenario: a-second-standalone-lock-on-one-node-is-refused
    requirements: [ACC-6, ACC-7]
    description: >
      lock() excludes the caller's OWN mount too, unlike the write paths. Two
      lock rows for one (mount, node) pair would leave unlock ambiguous about
      which of them it released.
    steps:
      - op: create_entry
        args: {path: /f.txt, data: {utf8: "x"}}
      - op: lock
        args: {path: /f.txt}
        bind: held
      - op: lock
        args: {path: /f.txt}
        raises: lock_held
      - op: unlock
        args: {lock: {ref: held.id}}
      - op: lock
        args: {path: /f.txt}

  - scenario: unlock-is-scoped-to-the-owning-mount
    requirements: [ACC-6]
    harness: two_mounts_one_volume
    description: >
      A lock is mount-scoped (ACC-6), so another mount may not release it --
      otherwise exclusion would be advisory in the worst sense. lock_held, not
      lock_invalid: the lock is live, it simply is not the caller's.
    steps:
      - op: create_entry
        args: {path: /f.txt, data: {utf8: "x"}}
      - op: lock
        args: {path: /f.txt, ttl_ms: 60000}
        via: first
        bind: held
      - op: unlock
        args: {lock: {ref: held.id}}
        via: second
        raises: lock_held
      - op: unlock
        args: {lock: {ref: held.id}}
        via: first

  - scenario: unlocking-an-already-released-lock-is-an-error
    requirements: [ACC-9]
    description: >
      Deliberately NOT idempotent, unlike close/abort. Succeeding would hide a
      client that believes it still holds a lock it does not, which is the
      failure mode a token-based protocol is least able to detect on its own.
    steps:
      - op: create_entry
        args: {path: /f.txt, data: {utf8: "x"}}
      - op: lock
        args: {path: /f.txt}
        bind: held
      - op: unlock
        args: {lock: {ref: held.id}}
      - op: unlock
        args: {lock: {ref: held.id}}
        raises: lock_invalid

  - scenario: open-write-refuses-a-token-for-a-different-node
    requirements: [ACC-6, ACC-7]
    description: >
      A lock authorises writes to ONE node. Without this an implementation
      that merely checks "is this token valid" would let a client lock a file
      it may write and then use that token against one it may not.
    steps:
      - op: create_entry
        args: {path: /f.txt, data: {utf8: "f"}}
      - op: create_entry
        args: {path: /g.txt, data: {utf8: "g"}}
      - op: lock
        args: {path: /g.txt}
        bind: held
      - op: open_write
        args: {path: /f.txt, mode: truncate, lock: {ref: held.id}}
        raises: lock_invalid

  - scenario: releasing-a-write-lock-readmits-the-other-mount
    requirements: [ACC-7, ACC-9]
    harness: two_mounts_one_volume
    description: >
      Exclusion lasts exactly as long as the lock. Closing the descriptor is
      what releases it — not the end of the operation that took it.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: close
        args: {fd: {ref: writer}}
        via: first
      - op: write_all
        args: {path: /contended.txt, data: {utf8: "now permitted"}}
        via: second
      - op: read_all
        args: {path: /contended.txt}
        via: second
        expect: {utf8: "now permitted"}

  - scenario: a-write-lock-excludes-another-mounts-rename
    requirements: [ACC-6, ACC-7, ACC-11]
    harness: two_mounts_one_volume
    description: >
      RENAME AND MOVE MUST AGREE. Renaming edits the directory entry the path
      walked, which is a placement change, so a lock refuses it exactly as it
      refuses move. The two differ only in mechanism — rename edits the edge
      name in place, move archives and recreates the edge — never in what a
      lock protects. An implementation that guards one and not the other has a
      hole shaped like its host's syscall routing: a kernel FUSE binding sends
      a same-directory `mv` to rename and a cross-directory `mv` to move, so
      the same user gesture would be guarded or not depending on whether the
      parent changed.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: rename
        args: {path: /contended.txt, name: stolen.txt}
        via: second
        raises: lock_held
      - op: exists
        args: {path: /contended.txt}
        via: first
        expect: true

  - scenario: a-write-lock-excludes-another-mounts-link
    requirements: [ACC-6, ACC-7, ACC-11, PI-1]
    harness: two_mounts_one_volume
    description: >
      A hardlink adds an active placement to the locked node and changes its
      derived nlink, so it is a placement change like any other. Milder than
      rename — a link can never carry the node away, because remove is already
      refused — but the rule does not have exceptions for mildness.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: link
        args: {from: /contended.txt, to: /alias.txt}
        via: second
        raises: lock_held
      - op: exists
        args: {path: /alias.txt}
        via: first
        expect: false

  - scenario: a-pack-is-refused-by-a-lock-deep-in-the-subtree
    requirements: [ACC-6, ACC-7, ACC-11, OP-6]
    harness: two_mounts_one_volume
    description: >
      PACK IS DESTRUCTION, SO IT IS CHECKED TRANSITIVELY. Pack archives every
      member of the subtree and supersedes the placement with one entry — the
      same archival remove_recursive performs, plus serialization. A lock
      anywhere below is therefore a lock on something pack would destroy, and
      an implementation that checks only the root silently consolidates a deep
      writer's work into a blob.
    steps:
      - op: create_container
        args: {path: /a}
      - op: create_container
        args: {path: /a/b}
      - op: create_entry
        args: {path: /a/b/deep.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /a/b/deep.txt, mode: truncate}
        via: first
        bind: writer
      - op: pack
        args: {path: /a}
        via: second
        raises: lock_held
      - op: exists
        args: {path: /a/b/deep.txt}
        via: first
        expect: true

  - scenario: a-write-lock-excludes-another-mounts-unpack
    requirements: [ACC-6, ACC-7, ACC-11, OP-7]
    harness: two_mounts_one_volume
    description: >
      Unpack archives the packed entry's placement, so the entry stops existing
      at that path — the same change remove makes, and refused for the same
      reason. Non-transitive, because a packed entry is a single leaf: there is
      nothing beneath it to check until it has been restored.
    steps:
      - op: create_container
        args: {path: /a}
      - op: create_entry
        args: {path: /a/f.txt, data: {utf8: "original"}}
      - op: pack
        args: {path: /a}
        via: first
        bind: packed
      - op: lock
        args: {path: /a, ttl_ms: 60000}
        via: first
        bind: held
      - op: unpack
        args: {path: /a}
        via: second
        raises: lock_held
      - op: unlock
        args: {lock: {ref: held.id}}
        via: first
      - op: unpack
        args: {path: /a}
        via: second
      - op: read_all
        args: {path: /a/f.txt}
        via: second
        expect: {utf8: "original"}

  - scenario: ownership-and-mode-changes-are-not-excluded-by-a-lock
    requirements: [ACC-7, ACC-11, NODE-4]
    harness: two_mounts_one_volume
    description: >
      A DELIBERATE BOUNDARY, pinned so a port does not tighten it out of
      symmetry with set_metadata. ACC-11 covers the NODE-6 metadata map, not
      POSIX ownership: advisory locks do not block chmod, chown or utimes on
      any POSIX system, and a kernel binding holds an engine lock for the whole
      life of an open write handle, so guarding these would make an ordinary
      `chmod` from a second mount fail against a file someone merely has open.
      That is stricter than POSIX and buys nothing — the protocol case that
      wants property exclusion (WebDAV PROPPATCH) stores its dead properties in
      the metadata map, which IS excluded.
      Mode is written in decimal (416 = 0o640); see conformance/README.md on
      why bare octal is not portable across YAML implementations.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: set_owner
        args: {path: /contended.txt, mode: 416}
        via: second
      - op: stat
        args: {path: /contended.txt}
        via: second
        expect: {mode: 416}

  - scenario: xattr-writes-are-not-excluded-by-a-lock
    requirements: [ACC-7, ACC-11]
    harness: two_mounts_one_volume
    description: >
      The same boundary for extended attributes, and the same reasoning: the
      `user.*` xattr namespace is a POSIX surface where locks are not a
      gate, and it is NOT where WebDAV dead properties live. Pinned as
      permitted so the two families cannot quietly diverge between
      implementations — a port that refuses here is as wrong as one that
      permits a rename.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "original"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: set_xattr
        args: {path: /contended.txt, name: "user.tag", value: {utf8: "set under a lock"}}
        via: second
      - op: get_xattr
        args: {path: /contended.txt, name: "user.tag"}
        via: second
        expect: {utf8: "set under a lock"}

  - scenario: copying-a-locked-node-is-permitted
    requirements: [ACC-7, ACC-11, OP-4, CV-3]
    harness: two_mounts_one_volume
    description: >
      Copy reads the source at its COMMITTED version (CV-3) and writes only
      new nodes under the destination's parent — it never overwrites an
      existing node, so there is nothing a lock protects for it to touch. The
      copy therefore sees the last committed bytes, never a torn state, and
      permitting it is safe rather than merely tolerated.
    steps:
      - op: create_entry
        args: {path: /contended.txt, data: {utf8: "committed"}}
      - op: open_write
        args: {path: /contended.txt, mode: truncate}
        via: first
        bind: writer
      - op: write
        args: {fd: {ref: writer}, data: {utf8: "uncommitted"}}
      - op: copy
        args: {from: /contended.txt, to: /snapshot.txt}
        via: second
      - op: read_all
        args: {path: /snapshot.txt}
        via: second
        expect: {utf8: "committed"}
