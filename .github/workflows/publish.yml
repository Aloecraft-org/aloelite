name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # A tag pushes once. When the tag-triggered run dies for reasons that have
  # nothing to do with the code -- the 2026-08-06 Actions outage failed every
  # job at "Getting action download info" -- there is otherwise no way to
  # retry short of deleting and re-pushing the tag. Dispatch the tag instead.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.3.3)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # On a tag push `inputs.ref` is empty and this is the tag, as before.
      # On a manual dispatch it is the tag typed into the input, so the build
      # is of that release -- not of whatever branch the dispatch came from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aloelite/

    permissions:
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
