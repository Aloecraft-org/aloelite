name: Publish to PyPI

# DO NOT RENAME THIS FILE.
#
# PyPI's trusted publisher is a tuple -- owner, repository, WORKFLOW
# FILENAME, environment -- so renaming this workflow revokes the grant
# exactly as moving the repository would, and nothing in the tree says the
# name is load-bearing. Worse, a tag's OIDC claim resolves from the commit
# the tag points at, so the rename cannot be undone after the fact: renaming
# the file back on the default branch does nothing for a tag that already
# exists, and only a new tag whose commit carries the right filename can
# publish.
#
# aloeschema renamed its `publish.yml` as a tidy-up and lost a version to it
# -- `v0.3.0` was refused with every other claim matching, and `0.3.1` exists
# only to carry the rename. It fails closed, so nothing is published wrongly;
# the version is simply spent. doc/ALIGNMENT.md §8.
#
# If it must be renamed, change the publisher on PyPI in the same commit.

# How a release reaches this file: release.yml's publish leg, the shared
# release-publish.yml, dispatches it with the tag once the GitHub release
# exists. A tag that leg creates is made by GITHUB_TOKEN and so starts no
# `on: push: tags:` run -- GitHub's recursion guard, which cannot be turned
# off -- and the dispatch is the documented exception. technoproj
# doc/STANDARD.md Part 2.
#
# There is deliberately NO tag-push trigger any more. A hand-pushed tag runs
# release.yml, which dispatches this; a push trigger as well would upload
# the same version twice and fail the second run. Retrying a run that died
# of infrastructure is the same dispatch, by hand, with the tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.5.0). Never a -dev.<n> tag."
        type: string
        required: true

jobs:
  # A -dev.<n> tag must never reach PyPI. `0.4.0-dev.7` normalises to the
  # perfectly valid PEP 440 version `0.4.0.dev7` -- and worse, the tree a dev
  # tag names still says `0.5.0` in pyproject.toml, so building it here would
  # upload a FINAL 0.5.0. A PyPI upload is IMMUTABLE: yankable, never
  # replaced and never reused. The shared publish leg hands every tag it
  # releases to this file, dev builds included, so the refusal lives here.
  # A dev tag skips the jobs below rather than failing, so a nightly does
  # not leave a red run behind. doc/ALIGNMENT.md §7, non-negotiable 7.
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v*-dev.*) echo "::notice::$TAG is a dev build -- not for PyPI"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            v*)       echo "publishing $TAG";                              echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            *)        echo "::error::'$TAG' is not a v* tag"; exit 1 ;;
          esac

  build:
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      # The tag typed into (or handed to) the input, so the build is of that
      # release -- not of the default branch this was dispatched on.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aloelite/

    permissions:
      contents: read     # naming id-token alone would drop this to none
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
