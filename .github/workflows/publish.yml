name: Publish to PyPI

# DO NOT RENAME THIS FILE.
#
# PyPI's trusted publisher is a tuple -- owner, repository, WORKFLOW
# FILENAME, environment -- so renaming this workflow revokes the grant
# exactly as moving the repository would, and nothing in the tree says the
# name is load-bearing. Worse, a tag's OIDC claim resolves from the commit
# the tag points at, so the rename cannot be undone after the fact: renaming
# the file back on the default branch does nothing for a tag that already
# exists, and only a new tag whose commit carries the right filename can
# publish.
#
# aloeschema renamed its `publish.yml` as a tidy-up and lost a version to it
# -- `v0.3.0` was refused with every other claim matching, and `0.3.1` exists
# only to carry the rename. It fails closed, so nothing is published wrongly;
# the version is simply spent. doc/ALIGNMENT.md §8.
#
# If it must be renamed, change the publisher on PyPI in the same commit.

on:
  push:
    # A -dev.<n> tag must never reach PyPI. `0.4.0-dev.7` normalises to the
    # perfectly valid PEP 440 version `0.4.0.dev7` and uploads without
    # complaint -- and a PyPI upload is IMMUTABLE: yankable, never replaced
    # and never reused. Pruning works on GitHub releases and does not work
    # here, which is why this exclusion goes in before the first dev tag is
    # cut rather than after. doc/ALIGNMENT.md §7, non-negotiable 7.
    #
    # The exclusion is a `!` pattern inside `tags`, NOT a `tags-ignore` block:
    # Actions refuses a workflow that carries both filters for one event, and
    # refuses it at load time -- the run appears named after the file, with
    # zero jobs, which is not obviously a syntax error from the outside.
    # Later patterns win, so the negative has to come second.
    tags:
      - "v*"
      - "!v*-dev.*"
  # A tag pushes once. When the tag-triggered run dies for reasons that have
  # nothing to do with the code -- the 2026-08-06 Actions outage failed every
  # job at "Getting action download info" -- there is otherwise no way to
  # retry short of deleting and re-pushing the tag. Dispatch the tag instead.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.3.3)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # On a tag push `inputs.ref` is empty and this is the tag, as before.
      # On a manual dispatch it is the tag typed into the input, so the build
      # is of that release -- not of whatever branch the dispatch came from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aloelite/

    permissions:
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
