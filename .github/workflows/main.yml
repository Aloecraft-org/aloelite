name: CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # Re-running a green-by-infrastructure-accident commit shouldn't need a
  # push. See the note in publish.yml.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ruff
      run: pip install ruff==0.15.8

    - name: Lint
      run: ruff check .

    - name: Check formatting
      run: ruff format --check .

    # CHANGELOG.yaml is the source of truth for release notes; CHANGELOG.md is
    # generated from it and committed. `check` is what stops that copy going
    # stale, and `consistency` is what catches the version drifting between
    # pyproject.toml, .technoproj and db.py's SCHEMA_ERA -- which is exactly
    # what happened at v0.3.6rc1, where only pyproject.toml moved.
    - name: Install changelog deps
      run: pip install pyyaml

    - name: Changelog is generated from its source
      run: python script/changelog.py check

    - name: Tree version agrees with the changelog
      run: python script/changelog.py consistency

  test:
    runs-on: ubuntu-latest
    # A wedged FUSE mount would otherwise hold the runner for the 6h default.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fuse3 libfuse3-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,fuse]

    - name: Run tests
      run: |
        pytest

  # Full suite against sqlite at EXACTLY the capability floor (3.45.0, first
  # jsonb release). setup-python's CPython links libsqlite3 dynamically, so
  # LD_LIBRARY_PATH swaps the library without rebuilding Python. Guards the
  # floor from silently rising: a template/schema change needing newer sqlite
  # fails here, not in the field.
  sqlite-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache sqlite 3.45.0 build
      id: cache-sqlite
      uses: actions/cache@v4
      with:
        path: ~/sqlite-floor
        key: sqlite-floor-3450000-${{ runner.os }}

    - name: Build sqlite 3.45.0
      if: steps.cache-sqlite.outputs.cache-hit != 'true'
      run: |
        curl -sSO https://www.sqlite.org/2024/sqlite-autoconf-3450000.tar.gz
        tar xzf sqlite-autoconf-3450000.tar.gz
        cd sqlite-autoconf-3450000
        ./configure --prefix="$HOME/sqlite-floor" > /dev/null
        make -j"$(nproc)" > /dev/null
        make install > /dev/null

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Verify the floor is loaded
      run: |
        export LD_LIBRARY_PATH="$HOME/sqlite-floor/lib"
        python -c "import sqlite3; v = sqlite3.sqlite_version_info; assert v == (3, 45, 0), v; print('sqlite', sqlite3.sqlite_version)"

    - name: Run tests at the floor
      run: |
        export LD_LIBRARY_PATH="$HOME/sqlite-floor/lib"
        pytest

  # Replay of the 2026-08-03 incident environment: Debian 12 (sqlite 3.40).
  # Asserts the capability probe refuses with the actionable message instead
  # of the failures that shipped (IntegrityError at mount, EIO through FUSE),
  # and that the bundled-sqlite extra then makes the same host work.
  sqlite-too-old:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: python:3.12-slim-bookworm
    steps:
    - uses: actions/checkout@v4

    - name: Install aloelite
      run: pip install -e .

    - name: Probe must refuse host sqlite 3.40 with a clear error
      run: |
        python - <<'EOF'
        import sqlite3
        assert sqlite3.sqlite_version_info < (3, 45), sqlite3.sqlite_version
        from aloelite import Aloelite, errors
        try:
            Aloelite(":memory:")
        except errors.Unsupported as e:
            msg = str(e)
            assert "bundled-sqlite" in msg and "3.45" in msg, msg
            print("refused correctly:", msg)
        else:
            raise SystemExit("opened on sqlite 3.40 -- probe did not fire")
        EOF

    - name: bundled-sqlite extra must rescue the same host
      run: |
        pip install -e .[bundled-sqlite]
        python - <<'EOF'
        from aloelite import Aloelite
        with Aloelite(":memory:") as fs:
            v = fs.create_volume("probe")
            with fs.mount(v.id) as m:
                m.put("/ok.txt", b"works")
                assert m.read_all("/ok.txt") == b"works"
        from aloelite._sqlite import sqlite3 as s
        print("bundled sqlite", s.sqlite_version, "on Debian 12: OK")
        EOF

  # The Rust port (rust/). Two things this job exists to enforce, from before
  # the first line of engine code (doc/DECISIONS.md D-7):
  #   1. aloelite-core builds for ALL THREE targets — native, wasm32-wasip2,
  #      wasm32-unknown-unknown — with zero cfg. The first std::fs import
  #      fails here in minutes rather than three weeks in.
  #   2. the conformance suite runs in a REAL BROWSER, not only natively.
  # Everything else (fmt, clippy, native tests) is ordinary hygiene.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown, wasm32-wasip2
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: System deps (fuser links libfuse3)
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config

    # rusqlite `bundled` compiles sqlite3.c with cc-rs, which needs a
    # WASI-capable clang and sysroot for wasm32-wasip2. Host clang falls back
    # to glibc headers and fails. Keep the version in step with
    # rust/.devcontainer/Dockerfile (WASI_SDK_MAJOR).
    - name: wasi-sdk for the wasip2 target
      run: |
        curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz | sudo tar xz -C /opt
        SDK=/opt/wasi-sdk-27.0-x86_64-linux
        echo "CC_wasm32_wasip2=$SDK/bin/clang"                          >> "$GITHUB_ENV"
        echo "AR_wasm32_wasip2=$SDK/bin/llvm-ar"                        >> "$GITHUB_ENV"
        echo "CFLAGS_wasm32_wasip2=--sysroot=$SDK/share/wasi-sysroot"   >> "$GITHUB_ENV"

    - name: Format
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build and test, native
      run: cargo test --workspace

    - name: "The rule: browser crates build for wasm32-unknown-unknown"
      run: cargo check -p aloelite-core -p aloelite-store -p aloelite-conformance -p aloelite-wasm --target wasm32-unknown-unknown

    - name: "The rule: WASI crates build for wasm32-wasip2"
      run: cargo check -p aloelite-core -p aloelite-store -p aloelite-conformance -p aloelite-cli --target wasm32-wasip2

    # The runner must match the wasm-bindgen crate version in Cargo.lock
    # EXACTLY — the bindgen schema is unstable and it refuses a mismatch.
    # Read it from the lockfile so the two can never drift. rust-cache keeps
    # ~/.cargo/bin, so this is slow once.
    - name: wasm-bindgen-test-runner, at the lockfile's version
      run: |
        WBG=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
        echo "wasm-bindgen $WBG"
        cargo install wasm-bindgen-cli --version "$WBG" --locked

    # ubuntu-latest ships Firefox and geckodriver. Browser mode is selected by
    # wasm_bindgen_test_configure!(run_in_browser) in the conformance crate's
    # tests; the runner is headless unless NO_HEADLESS is set. An empty test
    # binary passes, which is the guard being armed rather than fired.
    - name: Conformance in headless Firefox
      run: cargo test -p aloelite-conformance --target wasm32-unknown-unknown
