name: CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # Re-running a green-by-infrastructure-accident commit shouldn't need a
  # push. See the note in publish.yml.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ruff
      run: pip install ruff==0.15.8

    - name: Lint
      run: ruff check .

    - name: Check formatting
      run: ruff format --check .

    # CHANGELOG.yaml is the source of truth for release notes; CHANGELOG.md
    # is generated from it and committed, and `check` is what stops that copy
    # going stale.
    #
    # The shared release engine (doc/ALIGNMENT.md §3). Pinned to a commit
    # rather than a tag only because technoproj has cut none yet -- a commit
    # is the stricter pin of the two. A release pipeline that tracks a moving
    # branch is one that changes when nobody touched it. It brings PyYAML,
    # which is why there is no separate install for it.
    - name: The shared release engine
      run: pip install "git+https://github.com/Aloecraft-org/technoproj@d0f5382fbcb081898bec304949937e0b3f339bc8"

    # script/version.mk is a COPY of the engine's, placed by `technoproj
    # sync`. This is what makes it a copy that is checked rather than one
    # that is trusted, which is the whole difference between this and the
    # three drifted forks it replaces.
    - name: The shared make fragment has not drifted
      run: technoproj check

    - name: Changelog is generated from its source
      run: technoproj-changelog check

    # `consistency` catches the version drifting between pyproject.toml,
    # .technoproj and rust/Cargo.toml, and calls script/checks.py for the one
    # invariant that is aloelite's alone: db.py's SCHEMA_ERA against the
    # era the newest entry claims. v0.3.6rc1 is why -- only pyproject moved.
    - name: Tree version agrees with the changelog
      run: technoproj-changelog consistency

  test:
    runs-on: ubuntu-latest
    # A wedged FUSE mount would otherwise hold the runner for the 6h default.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fuse3 libfuse3-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,fuse]

    - name: Run tests
      run: |
        pytest

  # Full suite against sqlite at EXACTLY the capability floor (3.45.0, first
  # jsonb release). setup-python's CPython links libsqlite3 dynamically, so
  # LD_LIBRARY_PATH swaps the library without rebuilding Python. Guards the
  # floor from silently rising: a template/schema change needing newer sqlite
  # fails here, not in the field.
  sqlite-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache sqlite 3.45.0 build
      id: cache-sqlite
      uses: actions/cache@v4
      with:
        path: ~/sqlite-floor
        key: sqlite-floor-3450000-${{ runner.os }}

    - name: Build sqlite 3.45.0
      if: steps.cache-sqlite.outputs.cache-hit != 'true'
      run: |
        curl -sSO https://www.sqlite.org/2024/sqlite-autoconf-3450000.tar.gz
        tar xzf sqlite-autoconf-3450000.tar.gz
        cd sqlite-autoconf-3450000
        ./configure --prefix="$HOME/sqlite-floor" > /dev/null
        make -j"$(nproc)" > /dev/null
        make install > /dev/null

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Verify the floor is loaded
      run: |
        export LD_LIBRARY_PATH="$HOME/sqlite-floor/lib"
        python -c "import sqlite3; v = sqlite3.sqlite_version_info; assert v == (3, 45, 0), v; print('sqlite', sqlite3.sqlite_version)"

    - name: Run tests at the floor
      run: |
        export LD_LIBRARY_PATH="$HOME/sqlite-floor/lib"
        pytest

  # Replay of the 2026-08-03 incident environment: Debian 12 (sqlite 3.40).
  # Asserts the capability probe refuses with the actionable message instead
  # of the failures that shipped (IntegrityError at mount, EIO through FUSE),
  # and that the bundled-sqlite extra then makes the same host work.
  sqlite-too-old:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: python:3.12-slim-bookworm
    steps:
    - uses: actions/checkout@v4

    - name: Install aloelite
      run: pip install -e .

    - name: Probe must refuse host sqlite 3.40 with a clear error
      run: |
        python - <<'EOF'
        import sqlite3
        assert sqlite3.sqlite_version_info < (3, 45), sqlite3.sqlite_version
        from aloelite import Aloelite, errors
        try:
            Aloelite(":memory:")
        except errors.Unsupported as e:
            msg = str(e)
            assert "bundled-sqlite" in msg and "3.45" in msg, msg
            print("refused correctly:", msg)
        else:
            raise SystemExit("opened on sqlite 3.40 -- probe did not fire")
        EOF

    - name: bundled-sqlite extra must rescue the same host
      run: |
        pip install -e .[bundled-sqlite]
        python - <<'EOF'
        from aloelite import Aloelite
        with Aloelite(":memory:") as fs:
            v = fs.create_volume("probe")
            with fs.mount(v.id) as m:
                m.put("/ok.txt", b"works")
                assert m.read_all("/ok.txt") == b"works"
        from aloelite._sqlite import sqlite3 as s
        print("bundled sqlite", s.sqlite_version, "on Debian 12: OK")
        EOF

  # The manager UI in a real browser. A Flask test client is not a browser:
  # per-client sessions once passed every API test while being unusable in
  # one (the cookie was not reliably stored or sent), and two bootstrap modal
  # races were green here too. script/browser_check.py drives the actual admin
  # page in two separate browser profiles -- A unlocks an encrypted volume and
  # writes; B, a fresh profile, sees 'open elsewhere', proves the PIN itself,
  # and reads what A wrote. That is the only check covering the gap, and it
  # ran only by hand until now. Playwright drives Chromium over CDP, so this
  # job wants a browser rather than the WebDriver the Rust job installs.
  manager-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install playwright
        playwright install --with-deps chromium

    # ALOELITE_AUTH=cookie is what browser_check.py asserts against: the
    # per-client session mode the manager defaults to. The volume must be
    # encrypted for the PIN paths to exist at all.
    - name: A manager, with an encrypted volume to unlock
      run: |
        ALOELITE_ROOT="$RUNNER_TEMP/checkroot" ALOELITE_API_PORT=8437 \
          ALOELITE_AUTH=cookie aloelite-web &
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8437/volumes >/dev/null && break || sleep 1
        done
        curl -sf -X POST http://127.0.0.1:8437/volumes \
          -H 'Content-Type: application/json' -H 'X-Aloelite: 1' \
          -d '{"name":"vault","encrypted":true,"pin":"s3cret"}'

    - name: Two browser profiles against the admin page
      run: python script/browser_check.py

  # The Rust port (rust/). Two things this job exists to enforce, from before
  # the first line of engine code (doc/DECISIONS.md D-7):
  #   1. aloelite-core builds for ALL THREE targets — native, wasm32-wasip2,
  #      wasm32-unknown-unknown — with zero cfg. The first std::fs import
  #      fails here in minutes rather than three weeks in.
  #   2. the conformance suite runs in a REAL BROWSER, not only natively.
  # Everything else (fmt, clippy, native tests) is ordinary hygiene.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
      with:
        # The harness is its own workspace (it brings wasmtime, which the
        # engine's own `cargo test` must not have to build); cache it too,
        # or that build is paid on every run.
        workspaces: |
          rust
          rust/aloelite-extism/harness

    # libfuse3-dev links fuser; fuse3 provides fusermount3, so aloelite-fuse's
    # live-mount tests (tests/mount.rs) can mount as the unprivileged CI user.
    # Those tests self-skip if the runner cannot mount FUSE, so this only
    # widens coverage, never gates the job on the sandbox's mount policy.
    - name: System deps (fuser links libfuse3; fuse3 for the mount tests)
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3 pkg-config

    # rusqlite `bundled` compiles sqlite3.c with cc-rs, which needs a
    # WASI-capable clang and sysroot for both WASI targets -- preview 2 for
    # the CLI component, preview 1 for the Extism plug-in. Host clang falls
    # back to glibc headers and fails. cc-rs keys these by triple, so each
    # target needs its own three. Keep the version in step with
    # rust/.devcontainer/Dockerfile (WASI_SDK_MAJOR).
    - name: wasi-sdk for the WASI targets
      run: |
        curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz | sudo tar xz -C /opt
        SDK=/opt/wasi-sdk-27.0-x86_64-linux
        for t in wasip1 wasip2; do
          echo "CC_wasm32_$t=$SDK/bin/clang"                            >> "$GITHUB_ENV"
          echo "AR_wasm32_$t=$SDK/bin/llvm-ar"                          >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_$t=--sysroot=$SDK/share/wasi-sysroot"     >> "$GITHUB_ENV"
        done

    - name: Format
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build and test, native
      run: cargo test --workspace

    - name: "The rule: browser crates build for wasm32-unknown-unknown"
      run: cargo check -p aloelite-core -p aloelite-api -p aloelite-store -p aloelite-conformance -p aloelite-wasm --target wasm32-unknown-unknown

    - name: "The rule: WASI crates build for wasm32-wasip2"
      run: cargo check -p aloelite-core -p aloelite-api -p aloelite-store -p aloelite-conformance -p aloelite-cli --target wasm32-wasip2

    - name: "The rule: the plug-in builds for wasm32-wasip1"
      run: cargo check -p aloelite-core -p aloelite-api -p aloelite-extism --target wasm32-wasip1

    # The runner must match the wasm-bindgen crate version in Cargo.lock
    # EXACTLY — the bindgen schema is unstable and it refuses a mismatch.
    # Read it from the lockfile so the two can never drift. rust-cache keeps
    # ~/.cargo/bin, so this is slow once.
    - name: wasm-bindgen-test-runner, at the lockfile's version
      run: |
        WBG=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
        echo "wasm-bindgen $WBG"
        cargo install wasm-bindgen-cli --version "$WBG" --locked

    # The browser and its driver, named rather than inherited. ubuntu-latest
    # has shipped both, but an image that stopped would take the only
    # real-browser coverage in this workflow with it, and the failure would
    # read as a wasm-bindgen problem rather than a missing browser. Installing
    # them here also makes the job runnable on an image that never had them.
    - uses: browser-actions/setup-firefox@latest
    - uses: browser-actions/setup-geckodriver@latest
    - name: Browser and driver, as installed
      run: |
        firefox --version
        geckodriver --version | head -1

    # Browser mode is selected by wasm_bindgen_test_configure!(run_in_browser)
    # in the conformance crate's tests (run_in_dedicated_worker for the OPFS
    # ones, the only place sync access handles exist); the runner is headless
    # unless NO_HEADLESS is set.
    - name: Conformance in headless Firefox
      run: |
        set -o pipefail
        cargo test -p aloelite-conformance -p aloelite-api -p aloelite-store -p aloelite-wasm \
          --target wasm32-unknown-unknown 2>&1 | tee browser-tests.log
        # An empty test binary passes, so a dropped run_in_browser directive
        # or a crate that stopped building tests for this target would go
        # green in silence -- the guard armed but never fired. Count what
        # actually ran in the browser and hold it to a floor. 144 run today
        # (94 of them conformance scenarios); raise this when tests are added,
        # and lower it only on purpose.
        N=$(sed -n 's/.*test result: ok\. \([0-9]*\) passed.*/\1/p' browser-tests.log \
            | awk '{s+=$1} END {print s+0}')
        echo "browser tests passed: $N"
        test "$N" -ge 141
      env:
        # The unlock-key vectors run Argon2id at the format's pinned factors
        # (64 MiB / 3 / 4) twice, in a debug wasm build. wasm-bindgen-test's
        # default is 20 s per test; this run is the measurement of what a
        # mount costs the Worker, so let it measure rather than time out.
        WASM_BINDGEN_TEST_TIMEOUT: "180"

    # The page-facing package: the same wasm-bindgen CLI turns the cdylib
    # into an ES module plus a .d.ts. Generating it here proves every
    # exported signature is one wasm-bindgen can bind and TypeScript can
    # type, which `cargo check` alone does not.
    - name: The browser surface packages as an ES module
      run: |
        cargo build -p aloelite-wasm --target wasm32-unknown-unknown
        wasm-bindgen --target web --typescript --out-dir target/aloelite-wasm-pkg \
          target/wasm32-unknown-unknown/debug/aloelite_wasm.wasm
        test -s target/aloelite-wasm-pkg/aloelite_wasm.d.ts
        grep -q "class Fs" target/aloelite-wasm-pkg/aloelite_wasm.d.ts

    # The CLI's other target, driven for real: a WASI component under
    # wasmtime with the volume on a preopened host directory. `cargo check`
    # proves it compiles; this proves it opens a file, writes, and reads it
    # back through WASI's filesystem, which is the crate's promise.
    - name: wasmtime, for the WASI CLI
      uses: bytecodealliance/actions/wasmtime/setup@v1
      with:
        version: "v36.0.2"
    - name: The CLI runs as a WASI component
      run: |
        cargo build -p aloelite-cli --target wasm32-wasip2
        W=$(mktemp -d)
        echo "hello from wasi" > "$W/in.txt"
        A="wasmtime run --dir=$W::/work target/wasm32-wasip2/debug/aloelite.wasm"
        $A -f /work/t.fs
        $A -f /work/t.fs mkdir -p /docs
        $A -f /work/t.fs put /work/in.txt /docs/in.txt
        $A -f /work/t.fs ls -l /docs | grep -q "/docs/in.txt"
        test "$($A -f /work/t.fs cat /docs/in.txt)" = "hello from wasi"
        $A -f /work/t.fs get -r /docs /work/out        # /work/out does not exist: it becomes the tree root (cp -r)
        test "$(cat "$W/out/in.txt")" = "hello from wasi"
        $A -f /work/t.fs volumes | grep -q "main"

    # The plug-in under a real Extism host. `cargo test -p aloelite-extism`
    # covers everything on the plug-in's own side of the ABI; nothing but a
    # host covers the ABI itself, and that is not theoretical -- an export
    # named `close` silently replaced wasi-libc's, and SQLite's first
    # directory sync trapped four frames deep with nothing pointing at the
    # cause. The harness is a separate workspace because the host SDK brings
    # wasmtime.
    - name: The plug-in runs under Extism
      run: |
        cargo build -p aloelite-extism --target wasm32-wasip1 --release
        cargo run --release --manifest-path aloelite-extism/harness/Cargo.toml -- \
          target/wasm32-wasip1/release/aloelite_extism.wasm "$(mktemp -d)"
