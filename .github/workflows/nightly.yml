name: Nightly

# The nightly `-dev.<n>` release: the default branch's HEAD as a dev build
# once a day, on top of the one every merge to main already cuts
# (release.yml, `dev_builds` in .technoproj). doc/ALIGNMENT.md §7.
#
# This file is the schedule and nothing else. It picks the next number with
# `make dev-tag` and dispatches release.yml for it; the shared preflight,
# the reduced matrix, the generated body, the tag and the pruning of old
# dev releases (`keep-dev`) are all release.yml's, and PyPI is excluded in
# publish.yml. It pushes no tag: the publish leg creates the tag after every
# build job has passed, so a failed build leaves no tag and tomorrow's
# nightly, a re-run or the next merge takes the same number.
#
#   schedule           every 24h; skips when the newest dev tag already
#                      names HEAD, or a release.yml run for main is still
#                      going (it would take the same number)
#   workflow_dispatch  any branch or commit, with `force` to cut anyway

on:
  schedule:
    # 06:00 UTC. Late enough that a day's pushes are in, early enough that
    # the build is waiting rather than running when Europe starts.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to cut from (empty: the default branch)"
        required: false
        default: ""
      force:
        description: "Cut even if the newest dev tag already names HEAD"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: write    # dispatch release.yml, and read its runs

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Tags are the counter (§7: not a file in the tree, so a nightly
          # needs no commit and two branches cannot collide), and version.mk
          # reads them with `git tag --list`. A shallow clone has none.
          fetch-depth: 0

      # depth: the skips and the allocation
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # The newest dev tag by NUMBER, which is the same pipeline
          # version.mk allocates from -- the counter is global across
          # versions, so `v0.5.0-dev.9` is older than `v0.4.0-dev.10`.
          # A tag exists only once its release published, so a tag at HEAD
          # means HEAD is already out.
          LAST=$(git tag --list 'v*-dev.*' \
            | sed -n 's/^\(.*-dev\.\([0-9][0-9]*\)\)$/\2 \1/p' \
            | sort -n | tail -1 | cut -d' ' -f2- || true)
          if [[ "$FORCE" != "true" ]]; then
            if [[ -n "$LAST" && "$(git rev-list -n1 "$LAST")" == "$SHA" ]]; then
              echo "::notice::$LAST already names $SHA -- nothing new to build"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A merge build still running has allocated the number below
            # and not yet created its tag.
            BUSY=$(gh run list --workflow release.yml --branch main \
                     --json status --jq '[.[] | select(.status != "completed")] | length')
            if [[ "$BUSY" != "0" ]]; then
              echo "::notice::a release.yml run for main is still going -- it is building HEAD"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          TAG=$(make dev-tag)
          echo "building $TAG at $SHA (previous: ${LAST:-none})"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build it
        if: steps.plan.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run release.yml -f ref="$SHA" -f tag="$TAG" -f publish=true
          echo "dispatched release.yml for $TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"
