name: Release

# A `v*` tag builds every format and publishes the GitHub release, with the
# container image on GHCR and the wheel handed to publish.yml for PyPI.
# Two other paths build the identical matrix and publish nothing -- the
# rehearsal that proves the pipeline before a tag exists, artifacts left on
# the run with a manifest in the job summary: a push that changes this file
# (so an edit to the release pipeline tests itself; `paths` filters are not
# applied to tag pushes, so tags still always run), and a manual dispatch
# from any ref with `publish` off. `technoproj release cut --tag vX.Y.Z` is
# the dispatch that publishes; the workflow creates the tag itself. An
# existing tag is a re-run: the release is updated in place and its assets
# replaced, so a run that died of infrastructure needs no new tag.
#
# The two halves that are the same in every Aloecraft repository are
# technoproj's shared workflows (doc/ALIGNMENT.md §3, technoproj
# doc/STANDARD.md Part 2): `preflight` settles which tag, which commit,
# whether this run publishes and what the changelog says; `publish` writes
# BUILDINFO.txt and SHA256SUMS.txt, creates the tag and the release, and
# hands the tag to publish.yml. Everything between them is this project's.
#
# What a tag produces, and from where:
#   Python wheel + sdist          `python -m build`
#   aloelite_<platform>           the CLI, one bare binary per platform
#   aloelite_fuse_<platform>      the FUSE daemon, where it builds
#   aloelite_complete_<platform>  every binary for that platform, + BUILDINFO
#   aloelite_wasi.wasm            the CLI as a WASI component
#   aloelite_web.tar.gz           the browser package (ES module, .wasm, .d.ts)
#   BUILDINFO.txt                 tag, version, commit, branch, built, api_version
#   SHA256SUMS.txt                over all of the above
#
# Asset names follow doc/ALIGNMENT.md §4: a fixed platform vocabulary rather
# than Rust triples, the profile token last, and NO VERSION IN THE FILENAME --
# the release mirror materialises `latest/` as a symlink to the tag directory,
# so a versioned filename means no stable download URL exists.
#   ghcr.io/<owner>/aloelite:<v>  the manager image, amd64 + arm64
#                                 (`:latest` too when the release is stable)
# The release body is CHANGELOG.yaml's entry for the tag, rendered by
# technoproj-changelog, which also decides `prerelease`. doc/RELEASING.md
# walks the whole procedure.

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build (blank = the ref this was dispatched from)"
        type: string
        required: false
        default: ""
      tag:
        description: "Tag name, e.g. v0.5.0. Required when publishing; created if it does not exist."
        type: string
        required: false
        default: ""
      publish:
        description: "Publish. Leave off for a rehearsal."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Which tag, which commit, whether this publishes, and the changelog gate.
  # Every job below builds from `needs.preflight.outputs.sha`, never from
  # github.sha, so the assets and the notes come from one tree.
  #
  # `inputs.publish` is a boolean from the UI and a string from the API --
  # nightly.yml dispatches this with `gh workflow run`, which sends "true".
  # The shared workflow takes a boolean, so it is coerced here.
  preflight:
    uses: Aloecraft-org/technoproj/.github/workflows/release-preflight.yml@v0.3.1
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      publish: ${{ inputs.publish == true || inputs.publish == 'true' }}

  # What this project builds around the shared halves: the platform matrix,
  # sliced for a dev build, the PEP 440 spelling a dev wheel is stamped with,
  # and a BUILDINFO.txt for the `complete` archives to carry. The release's
  # own BUILDINFO.txt is written by the publish leg from the same inputs, so
  # the two differ only in `built:`.
  plan:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      pep440: ${{ steps.pep440.outputs.pep440 }}
      matrix: ${{ steps.matrix.outputs.include }}
    steps:
      # `0.5.0-dev.1` -> `0.5.0.dev1`, which is what PEP 440 makes of that
      # tag and what sorts below every other prerelease of 0.5.0. Only a dev
      # build is stamped with it; every other version is already the tree's,
      # held to pyproject.toml by `consistency` in preflight.
      - id: pep440
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: echo "pep440=${VERSION/-dev./.dev}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: release_meta
      - name: BUILDINFO.txt
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SHA: ${{ needs.preflight.outputs.sha }}
          BRANCH: ${{ needs.preflight.outputs.branch }}
        run: |
          mkdir -p buildinfo
          {
            echo "tag: ${TAG:-(untagged)}"
            echo "version: $VERSION"
            echo "commit: $SHA"
            echo "branch: $BRANCH"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat release_meta/facts.txt
          } | tee buildinfo/BUILDINFO.txt
      # Not `dist-*`: the publish leg writes the release's own BUILDINFO.txt.
      - uses: actions/upload-artifact@v4
        with:
          name: buildinfo
          path: buildinfo/BUILDINFO.txt
      # The platform vocabulary of ALIGNMENT.md §4, as data rather than as a
      # `strategy.matrix` literal, because a -dev.<n> build takes the first
      # row and nothing else: one platform, no cross-compilation (§7). Rows
      # are ordered so that slicing is all it takes. `platform` is carried
      # rather than derived -- a Rust triple is not a platform name, and
      # mapping one to the other in bash is how the two drift.
      - id: matrix
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/platforms.json" <<'JSON'
          [
            {"os": "ubuntu-latest",  "target": "x86_64-unknown-linux-gnu",
             "platform": "linux_x86_64_gnu",
             "crates": "-p aloelite-cli -p aloelite-fuse",
             "bins": "aloelite aloelite-fuse"},
            {"os": "ubuntu-latest",  "target": "aarch64-unknown-linux-gnu",
             "platform": "linux_arm64_gnu", "cross": true,
             "crates": "-p aloelite-cli -p aloelite-fuse",
             "bins": "aloelite aloelite-fuse"},
            {"os": "ubuntu-latest",  "target": "x86_64-unknown-linux-musl",
             "platform": "linux_x86_64_musl", "musl": true,
             "crates": "-p aloelite-cli -p aloelite-fuse",
             "bins": "aloelite aloelite-fuse"},
            {"os": "macos-latest",   "target": "aarch64-apple-darwin",
             "platform": "darwin_arm64",
             "crates": "-p aloelite-cli", "bins": "aloelite"},
            {"os": "macos-latest",   "target": "x86_64-apple-darwin",
             "platform": "darwin_x86_64",
             "crates": "-p aloelite-cli", "bins": "aloelite"},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc",
             "platform": "windows_x86_64",
             "crates": "-p aloelite-cli", "bins": "aloelite.exe"}
          ]
          JSON
          N=$([[ "${{ needs.preflight.outputs.dev }}" == "true" ]] && echo 1 || echo 99)
          python -c 'import json,sys; print("include=" + json.dumps(json.load(open(sys.argv[1]))[:int(sys.argv[2])]))' \
            "$RUNNER_TEMP/platforms.json" "$N" \
            | tee -a "$GITHUB_OUTPUT"

  python:
    needs: [preflight, plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      # A dev build's wheel must not be named after a release it is not.
      # publish.yml keeps it off PyPI; this keeps it from claiming 0.5.0 on
      # the disk of whoever downloads it. `.devN` is PEP 440's own spelling
      # for exactly this and installs and compares correctly.
      - if: needs.preflight.outputs.dev == 'true'
        shell: bash
        run: |
          python - <<'EOF'
          import re
          p = "pyproject.toml"
          s = open(p).read()
          s, n = re.subn(r'^version\s*=\s*"[^"]+"',
                         'version = "${{ needs.plan.outputs.pep440 }}"',
                         s, count=1, flags=re.M)
          assert n == 1, "no version line in pyproject.toml"
          open(p, "w").write(s)
          EOF
          grep -m1 '^version' pyproject.toml
      - run: python -m build
      # ALIGNMENT.md §9's third gate: install WHAT IS ABOUT TO BE PUBLISHED
      # into a clean environment and exercise the entry point through it. An
      # editable install is not that and neither is a green suite -- CI
      # resolves the package straight from the source tree, so a packaging
      # mistake is invisible to every other gate. aloeschema published five
      # unusable wheels that way, its `aloeschema.data` subpackage absent
      # from every one, while its tests passed.
      #
      # The subpackages are the point: `manager.engine` and `manager.ui` are
      # exactly what `packages.find`'s include globs have to have matched.
      - name: The built wheel actually works
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'SMOKE'
          import aloelite.cli, manager.engine, manager.ui
          from aloelite.db import SCHEMA_ERA
          assert SCHEMA_ERA, "no schema era"
          print("packages present, schema era", SCHEMA_ERA)
          SMOKE
          /tmp/smoke/bin/aloelite --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/*

  native:
    needs: [preflight, plan]
    strategy:
      fail-fast: false
      # One row per platform, sliced by `plan`: everything for a release, the
      # first row alone for a -dev.<n> build. The list itself lives there.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-${{ matrix.target }}
      # rusqlite `bundled` compiles sqlite3.c, so a cross build needs a C
      # toolchain for the target, not only a Rust one.
      - if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.crates }}
      # BUILDINFO travels inside every `complete` archive, so someone who
      # unpacked one can still read what they have.
      - uses: actions/download-artifact@v4
        with:
          name: buildinfo
          path: buildinfo
      # Two shapes per platform, because they answer different questions.
      # A bare binary is what `curl -O && chmod +x` wants and what a stable
      # `latest/` URL is for -- ALIGNMENT.md §4: single binaries ship bare so
      # that `latest/` resolves to something directly executable. `complete`
      # is a reserved COMPONENT name (second field, not a trailing profile)
      # and is an archive because it holds more than one file.
      - name: Package
        run: |
          T="${{ matrix.target }}"
          P="${{ matrix.platform }}"
          STAGE="aloelite_complete_$P"
          mkdir -p "$STAGE" ../dist
          for b in ${{ matrix.bins }}; do
            base="${b%.exe}"; ext="${b#$base}"      # "" or ".exe"
            cp "target/$T/release/$b" "../dist/${base//-/_}_$P$ext"
            cp "target/$T/release/$b" "$STAGE/"
          done
          cp ../buildinfo/BUILDINFO.txt "$STAGE/"
          if [[ "$T" == *windows* ]]; then
            7z a "../dist/$STAGE.zip" "$STAGE" > /dev/null
          else
            tar czf "../dist/$STAGE.tar.gz" "$STAGE"
          fi
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-native-${{ matrix.target }}
          path: dist/*

  # Skipped for a -dev.<n> build: the suffix is what buys skipping wasm and
  # the cross-compiled half (ALIGNMENT.md §7). Everything downstream of this
  # job therefore runs under `always()` and judges its needs by result.
  wasm:
    needs: preflight
    if: needs.preflight.outputs.dev != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-wasm
      - name: wasi-sdk for the wasip2 target
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz | sudo tar xz -C /opt
          SDK=/opt/wasi-sdk-27.0-x86_64-linux
          echo "CC_wasm32_wasip2=$SDK/bin/clang"                          >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip2=$SDK/bin/llvm-ar"                        >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_wasip2=--sysroot=$SDK/share/wasi-sysroot"   >> "$GITHUB_ENV"
      - name: wasm-bindgen, at the lockfile's version
        run: |
          WBG=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$WBG" --locked
      - name: The browser package
        run: |
          cargo build --release --locked -p aloelite-wasm --target wasm32-unknown-unknown
          PKG="aloelite_web"
          wasm-bindgen --target web --typescript --out-dir "$PKG" target/wasm32-unknown-unknown/release/aloelite_wasm.wasm
          cp aloelite-wasm/README.md "$PKG/"
          mkdir -p ../dist
          tar czf "../dist/$PKG.tar.gz" "$PKG"
      - name: The CLI as a WASI component
        run: |
          cargo build --release --locked -p aloelite-cli --target wasm32-wasip2
          cp target/wasm32-wasip2/release/aloelite.wasm "../dist/aloelite_wasi.wasm"
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wasm
          path: dist/*

  # The manager image. Built for amd64 alone on a dry run (a multi-platform
  # build cannot be loaded locally, only pushed); both platforms when
  # publishing. GHCR is the GitHub side of images; Docker Hub stays the
  # Makefile's manual push.
  image:
    needs: [preflight, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: needs.preflight.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMAGE:${{ needs.preflight.outputs.version }}"
          if [[ "${{ needs.preflight.outputs.prerelease }}" != "true" ]]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ (needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.dev != 'true') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ needs.preflight.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Nothing ships untested.
  #
  # The build jobs above run in parallel with main.yml's matrix on the same
  # commit -- two independent workflow runs, with nothing connecting them
  # until here. This job is that connection, and `image` (which pushes to
  # GHCR itself) and `release` are the two that wait for it. The build matrix
  # does not, so this costs no wall clock on the slow half.
  #
  # Usually it costs none at all: a commit is pushed to main and tested
  # before it is tagged, so main.yml has already gone green on this SHA and
  # there is nothing to wait for. It blocks only when a tag lands on a commit
  # whose tests are still running -- which is exactly when you want it to.
  gate:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # A dry run publishes nothing, and a -dev.<n> build is exempt by
      # design: skipping the full gate is what that suffix is for
      # (doc/ALIGNMENT.md §7).
      - name: The test matrix passed on this commit
        if: ${{ needs.preflight.outputs.publish == 'true' && !contains(needs.preflight.outputs.tag, '-dev.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.preflight.outputs.sha }}
        shell: bash
        run: |
          set -uo pipefail
          # The matrix runs well inside 30 minutes; the budget is what turns
          # "main.yml never ran for this commit" into a failure rather than a
          # job that sits there until the six-hour default.
          DEADLINE=$(( SECONDS + 40 * 60 ))
          while :; do
            RUNS=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?head_sha=$SHA" \
              --jq '.workflow_runs[] | "\(.status)/\(.conclusion)"' || true)
            # Any completed success is enough: a run from the push to main is
            # the same commit and the same matrix as a run from the tag.
            if grep -qx 'completed/success' <<< "$RUNS"; then
              echo "CI/CD is green on $SHA"
              exit 0
            fi
            if [[ -n "$RUNS" ]] && ! grep -qv '^completed/' <<< "$RUNS"; then
              echo "::error::CI/CD finished on $SHA without a success"
              echo "$RUNS"
              exit 1
            fi
            if (( SECONDS > DEADLINE )); then
              echo "::error::timed out waiting for CI/CD on $SHA"
              echo "${RUNS:-no run found for this commit}"
              exit 1
            fi
            echo "waiting for CI/CD on $SHA -- ${RUNS:-no run yet}"
            sleep 30
          done

  # Dry run: what a tag would have shipped, in the run's summary.
  manifest:
    needs: [preflight, python, native, wasm]
    # `always()` because `wasm` is skipped for a dev build, and a skipped
    # need would otherwise skip this too. Skipped is not failed.
    if: ${{ always() && needs.preflight.outputs.publish != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - shell: bash
        run: |
          cd dist && sha256sum * | tee SHA256SUMS.txt
          {
            echo "### Release dry run: ${{ needs.preflight.outputs.version }} from \`${{ needs.preflight.outputs.sha }}\`"
            echo
            echo '| asset | size |'; echo '|---|---|'
            for f in *; do printf '| `%s` | %s |\n' "$f" "$(du -h "$f" | cut -f1)"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # BUILDINFO.txt, SHA256SUMS.txt, the tag, the release, the dev-release
  # pruning, and the hand-off of the tag to publish.yml -- which a tag created
  # by GITHUB_TOKEN would otherwise never trigger. publish.yml refuses a
  # -dev.<n> tag itself, so a dev build cannot reach PyPI through this.
  publish:
    needs: [preflight, gate, python, native, wasm, image]
    # `always()` for the same reason as `manifest`: a dev build skips `wasm`
    # and still publishes. Nothing ships if any need actually failed.
    if: ${{ always() && needs.preflight.outputs.publish == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: write   # the tag and the release; a called workflow cannot grant itself this
      actions: write    # dispatch publish.yml with the tag
    uses: Aloecraft-org/technoproj/.github/workflows/release-publish.yml@v0.3.1
    with:
      tag:        ${{ needs.preflight.outputs.tag }}
      sha:        ${{ needs.preflight.outputs.sha }}
      branch:     ${{ needs.preflight.outputs.branch }}
      version:    ${{ needs.preflight.outputs.version }}
      prerelease: ${{ needs.preflight.outputs.prerelease }}
      name:       ${{ needs.preflight.outputs.tag }}
      artifacts:  dist-*
      keep-dev:   5
      registry-workflow: publish.yml
