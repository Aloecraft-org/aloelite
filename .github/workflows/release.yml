name: Release

# A `v*` tag builds every format and publishes the GitHub release, with the
# container image on GHCR. Two other paths build the identical matrix and
# publish nothing -- the dry run that proves the pipeline before a tag
# exists, artifacts left on the run with a manifest in the job summary:
# a push that changes this file (so an edit to the release pipeline tests
# itself; `paths` filters are not applied to tag pushes, so tags still always
# run), and a manual dispatch from any ref with `publish` off. Re-running a
# tag's release is the dispatch with the tag as `ref` and `publish` on; the
# release is updated in place and its assets replaced, so a run that died of
# infrastructure needs no new tag. (A dispatch by file name works once the
# workflow exists on the default branch, which is how GitHub registers it.)
#
# What a tag produces, and from where:
#   Python wheel + sdist          `python -m build`
#   aloelite_<platform>           the CLI, one bare binary per platform
#   aloelite_fuse_<platform>      the FUSE daemon, where it builds
#   aloelite_complete_<platform>  every binary for that platform, + BUILDINFO
#   aloelite_wasi.wasm            the CLI as a WASI component
#   aloelite_web.tar.gz           the browser package (ES module, .wasm, .d.ts)
#   BUILDINFO.txt                 tag, version, commit, branch, schema era
#   SHA256SUMS.txt                over all of the above
#
# Asset names follow doc/ALIGNMENT.md §4: a fixed platform vocabulary rather
# than Rust triples, the profile token last, and NO VERSION IN THE FILENAME --
# the release mirror materialises `latest/` as a symlink to the tag directory,
# so a versioned filename means no stable download URL exists.
#   ghcr.io/<owner>/aloelite:<v>  the manager image, amd64 + arm64
#                                 (`:latest` too when the release is stable)
# The release body is CHANGELOG.yaml's entry for the tag, rendered by
# script/changelog.py, which also decides `prerelease`. PyPI is publish.yml,
# unchanged, on the same tag. doc/RELEASING.md walks the whole procedure.

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (empty: the ref this was dispatched from)"
        required: false
        default: ""
      publish:
        description: "Publish the GitHub release and push the image (ref must be a v* tag)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # What is being built, and whether it is being published. One place, so
  # every job below agrees on the version string in asset names.
  plan:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # `git branch -r --contains` needs the remote branches, and the
          # default shallow clone has none. BUILDINFO's `branch` line is the
          # only thing that distinguishes two dev builds cut from different
          # branches (ALIGNMENT.md §5), so it is worth a full fetch here.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: plan
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref }}"
          # Only a tag push publishes; a branch push (this file changed) and
          # a dispatch without `publish` are dry runs.
          PUBLISH="${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && 'true' || (inputs.publish == true && 'true' || 'false') }}"
          case "$REF" in
            refs/tags/v*) TAG="${REF#refs/tags/}" ;;
            v*)           TAG="$REF" ;;
            *)            TAG="" ;;
          esac
          if [[ "$PUBLISH" == "true" && -z "$TAG" ]]; then
            echo "::error::publish needs a v* tag as ref, got '$REF'"; exit 1
          fi
          if [[ -n "$TAG" ]]; then
            # release-check prints prerelease= and version= for the tag, and
            # refuses a tag the changelog does not claim (or, when publishing,
            # a final whose entry is still unreleased).
            ARGS=(); [[ "$PUBLISH" == "true" ]] && ARGS+=(--publish)
            python script/changelog.py release-check --tag "$TAG" "${ARGS[@]}" | tee -a "$GITHUB_OUTPUT"
          else
            V=$(python -c 'import re; print(re.search(r"^version\s*=\s*\"([^\"]+)\"", open("pyproject.toml").read(), re.M).group(1))')
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          # The commit, not the ref: `github.sha` is the dispatching ref on a
          # workflow_dispatch, which is not necessarily what is being built.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # What `.technoproj` cannot hold -- committing the file changes the
      # commit it would claim -- and what the filename must not carry.
      # ALIGNMENT.md §5. `schema_era` is this project's compatibility fact,
      # and it is the one a consumer must actually check: it decides whether
      # an existing volume file still opens.
      - name: BUILDINFO.txt
        shell: bash
        run: |
          SHA="${{ steps.plan.outputs.sha }}"
          # A tag push carries no branch: github.ref IS the tag. Find one that
          # contains the commit and record what was found, not a guess.
          BRANCH="${{ inputs.ref }}"
          if [[ -z "$BRANCH" || "$BRANCH" == v* ]]; then
            BRANCH=$(git branch -r --contains "$SHA" --format='%(refname:lstrip=3)' \
                     | grep -vx HEAD | head -1)
          fi
          FIELD() { python -c "import re,sys; m=re.search(sys.argv[2], open(sys.argv[1]).read(), re.M); print(m.group(1) if m else '')" "$1" "$2"; }
          mkdir -p dist
          {
            echo "tag: ${{ steps.plan.outputs.tag || '(untagged)' }}"
            echo "version: ${{ steps.plan.outputs.version }}"
            echo "pep440: $(FIELD pyproject.toml '^version\s*=\s*"([^"]+)"')"
            echo "commit: $SHA"
            echo "branch: ${BRANCH:-(detached)}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "schema_era: $(FIELD aloelite/db.py '^SCHEMA_ERA\s*=\s*(\d+)')"
          } | tee dist/BUILDINFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist-buildinfo
          path: dist/BUILDINFO.txt
      - name: Release notes, from the changelog
        if: steps.plan.outputs.tag != ''
        run: python script/changelog.py render md --tag "${{ steps.plan.outputs.tag }}" | tee release-notes.md
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.tag != ''
        with:
          name: release-notes
          path: release-notes.md

  python:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/*

  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is the asset-name vocabulary (ALIGNMENT.md §4): os,
          # arch, and libc where it distinguishes two builds of the same
          # thing. It is carried rather than derived because a Rust triple is
          # not a platform name and mapping one to the other in bash is how
          # the two drift.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux_x86_64_gnu
            crates: -p aloelite-cli -p aloelite-fuse
            bins: aloelite aloelite-fuse
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64_gnu
            crates: -p aloelite-cli -p aloelite-fuse
            bins: aloelite aloelite-fuse
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux_x86_64_musl
            crates: -p aloelite-cli -p aloelite-fuse
            bins: aloelite aloelite-fuse
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin_arm64
            crates: -p aloelite-cli
            bins: aloelite
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin_x86_64
            crates: -p aloelite-cli
            bins: aloelite
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows_x86_64
            crates: -p aloelite-cli
            bins: aloelite.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-${{ matrix.target }}
      # rusqlite `bundled` compiles sqlite3.c, so a cross build needs a C
      # toolchain for the target, not only a Rust one.
      - if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.crates }}
      # BUILDINFO travels inside every `complete` archive, so someone who
      # unpacked one can still read what they have.
      - uses: actions/download-artifact@v4
        with:
          name: dist-buildinfo
          path: buildinfo
      # Two shapes per platform, because they answer different questions.
      # A bare binary is what `curl -O && chmod +x` wants and what a stable
      # `latest/` URL is for -- ALIGNMENT.md §4: single binaries ship bare so
      # that `latest/` resolves to something directly executable. `complete`
      # is a reserved COMPONENT name (second field, not a trailing profile)
      # and is an archive because it holds more than one file.
      - name: Package
        run: |
          T="${{ matrix.target }}"
          P="${{ matrix.platform }}"
          STAGE="aloelite_complete_$P"
          mkdir -p "$STAGE" ../dist
          for b in ${{ matrix.bins }}; do
            base="${b%.exe}"; ext="${b#$base}"      # "" or ".exe"
            cp "target/$T/release/$b" "../dist/${base//-/_}_$P$ext"
            cp "target/$T/release/$b" "$STAGE/"
          done
          cp ../buildinfo/BUILDINFO.txt "$STAGE/"
          if [[ "$T" == *windows* ]]; then
            7z a "../dist/$STAGE.zip" "$STAGE" > /dev/null
          else
            tar czf "../dist/$STAGE.tar.gz" "$STAGE"
          fi
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-native-${{ matrix.target }}
          path: dist/*

  wasm:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-wasm
      - name: wasi-sdk for the wasip2 target
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz | sudo tar xz -C /opt
          SDK=/opt/wasi-sdk-27.0-x86_64-linux
          echo "CC_wasm32_wasip2=$SDK/bin/clang"                          >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip2=$SDK/bin/llvm-ar"                        >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_wasip2=--sysroot=$SDK/share/wasi-sysroot"   >> "$GITHUB_ENV"
      - name: wasm-bindgen, at the lockfile's version
        run: |
          WBG=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$WBG" --locked
      - name: The browser package
        run: |
          cargo build --release --locked -p aloelite-wasm --target wasm32-unknown-unknown
          PKG="aloelite_web"
          wasm-bindgen --target web --typescript --out-dir "$PKG" target/wasm32-unknown-unknown/release/aloelite_wasm.wasm
          cp aloelite-wasm/README.md "$PKG/"
          mkdir -p ../dist
          tar czf "../dist/$PKG.tar.gz" "$PKG"
      - name: The CLI as a WASI component
        run: |
          cargo build --release --locked -p aloelite-cli --target wasm32-wasip2
          cp target/wasm32-wasip2/release/aloelite.wasm "../dist/aloelite_wasi.wasm"
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wasm
          path: dist/*

  # The manager image. Built for amd64 alone on a dry run (a multi-platform
  # build cannot be loaded locally, only pushed); both platforms when
  # publishing. GHCR is the GitHub side of images; Docker Hub stays the
  # Makefile's manual push.
  image:
    needs: [plan, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMAGE:${{ needs.plan.outputs.version }}"
          if [[ "${{ needs.plan.outputs.prerelease }}" != "true" ]]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ needs.plan.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ needs.plan.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Nothing ships untested.
  #
  # The build jobs above run in parallel with main.yml's matrix on the same
  # commit -- two independent workflow runs, with nothing connecting them
  # until here. This job is that connection, and `image` (which pushes to
  # GHCR itself) and `release` are the two that wait for it. The build matrix
  # does not, so this costs no wall clock on the slow half.
  #
  # Usually it costs none at all: a commit is pushed to main and tested
  # before it is tagged, so main.yml has already gone green on this SHA and
  # there is nothing to wait for. It blocks only when a tag lands on a commit
  # whose tests are still running -- which is exactly when you want it to.
  gate:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # A dry run publishes nothing, and a -dev.<n> build is exempt by
      # design: skipping the full gate is what that suffix is for
      # (doc/ALIGNMENT.md §7).
      - name: The test matrix passed on this commit
        if: ${{ needs.plan.outputs.publish == 'true' && !contains(needs.plan.outputs.tag, '-dev.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -uo pipefail
          # The matrix runs well inside 30 minutes; the budget is what turns
          # "main.yml never ran for this commit" into a failure rather than a
          # job that sits there until the six-hour default.
          DEADLINE=$(( SECONDS + 40 * 60 ))
          while :; do
            RUNS=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?head_sha=$SHA" \
              --jq '.workflow_runs[] | "\(.status)/\(.conclusion)"' || true)
            # Any completed success is enough: a run from the push to main is
            # the same commit and the same matrix as a run from the tag.
            if grep -qx 'completed/success' <<< "$RUNS"; then
              echo "CI/CD is green on $SHA"
              exit 0
            fi
            if [[ -n "$RUNS" ]] && ! grep -qv '^completed/' <<< "$RUNS"; then
              echo "::error::CI/CD finished on $SHA without a success"
              echo "$RUNS"
              exit 1
            fi
            if (( SECONDS > DEADLINE )); then
              echo "::error::timed out waiting for CI/CD on $SHA"
              echo "${RUNS:-no run found for this commit}"
              exit 1
            fi
            echo "waiting for CI/CD on $SHA -- ${RUNS:-no run yet}"
            sleep 30
          done

  # Dry run: what a tag would have shipped, in the run's summary.
  manifest:
    needs: [plan, python, native, wasm]
    if: needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - shell: bash
        run: |
          cd dist && sha256sum * | tee SHA256SUMS.txt
          {
            echo "### Release dry run: ${{ needs.plan.outputs.version }} from \`${{ needs.plan.outputs.ref }}\`"
            echo
            echo '| asset | size |'; echo '|---|---|'
            for f in *; do printf '| `%s` | %s |\n' "$f" "$(du -h "$f" | cut -f1)"; done
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [plan, gate, python, native, wasm, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - shell: bash
        run: cd dist && sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          body_path: notes/release-notes.md
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.plan.outputs.prerelease != 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
