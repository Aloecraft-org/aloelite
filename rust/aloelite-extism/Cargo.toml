[package]
name = "aloelite-extism"
description = "Aloelite as an Extism plug-in: the Mount API over MessagePack, in a sandbox, callable from any language with an Extism SDK. wasm32-wasip1, with the volume on a host path the manifest grants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# cdylib is the plug-in; rlib is what `cargo test` links, so the codec is
# tested natively without a wasm runtime.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aloelite-core = { path = "../aloelite-core" }
aloelite-api = { path = "../aloelite-api" }
extism-pdk = { workspace = true }
rusqlite = { workspace = true }
rmpv = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
