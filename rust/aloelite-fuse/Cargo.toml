[package]
name = "aloelite-fuse"
description = "The Linux FUSE daemon over aloelite-core via `fuser`. Native only, by nature: there is no kernel to talk to in a browser or a WASI component."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "aloelite-fuse"
path = "src/main.rs"

[dependencies]
aloelite-core = { path = "../aloelite-core" }
aloelite-store = { path = "../aloelite-store" }
ego_platform = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
