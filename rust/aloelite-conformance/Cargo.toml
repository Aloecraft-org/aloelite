[package]
name = "aloelite-conformance"
description = "Runs conformance/scenarios/*.yaml and conformance/vectors/*.json against aloelite-core, on every target — under cargo test natively and under wasm-bindgen-test in a real browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aloelite-core = { path = "../aloelite-core" }
aloelite-store = { path = "../aloelite-store" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
