[package]
name = "aloelite-wasm"
description = "The browser surface: a wasm-bindgen API over aloelite-core, meant to run inside a Dedicated Worker with the volume in OPFS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aloelite-core = { path = "../aloelite-core" }
aloelite-store = { path = "../aloelite-store" }
ego_platform = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
log = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
