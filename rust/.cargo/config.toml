# Workspace build configuration. Keep target-specific toolchain knobs HERE,
# not in per-crate build scripts, so every crate builds identically.

# Browser tests: `cargo test -p aloelite-conformance -p aloelite-store -p aloelite-wasm --target wasm32-unknown-unknown`
# hands the test binary to wasm-bindgen-test-runner, which drives a headless
# browser. The runner must match the `wasm-bindgen` version in Cargo.lock
# EXACTLY (the bindgen schema is unstable and it refuses a mismatch); CI reads
# the version from the lockfile, the devcontainer pins it.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

# WASI: rusqlite `bundled` compiles sqlite3.c with cc-rs, which needs a
# WASI-capable clang and sysroot. Point the three cc-rs variables at a
# wasi-sdk install; plain host clang falls back to glibc headers and fails
# with "'bits/libc-header-start.h' file not found". The devcontainer and CI
# set these to their wasi-sdk paths; set WASI_SDK_PATH locally.
#   CC_wasm32_wasip2     = $WASI_SDK_PATH/bin/clang
#   AR_wasm32_wasip2     = $WASI_SDK_PATH/bin/llvm-ar
#   CFLAGS_wasm32_wasip2 = --sysroot=$WASI_SDK_PATH/share/wasi-sysroot
