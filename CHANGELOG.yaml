# Aloelite changelog -- the source of truth for release notes.
#
# This file, not the GitHub release body, is what a release page should be
# generated from. Edit it here; everything downstream is derived. Run
# `technoproj-changelog generate` after editing, and commit CHANGELOG.md and
# changelog.json alongside it.
#
# Shape follows keepachangelog.com 1.1.0, with the six standard sections kept
# under their own names so the mapping to Markdown is mechanical. Bullets are
# ordinary strings; any of them may be a `|` block when the detail earns it,
# in which case the first line is the headline.
#
#   version           Aloelite version, without the leading `v`.
#   tag               Optional. The tag is `v{version}` and derives; this
#                     repository carries no upstream project's tags, so
#                     nothing else can claim the name. Set it only for a
#                     one-off, and it is checked against the derivation.
#   date              ISO date published; null when unreleased.
#   candidates        Optional. Release candidates cut from this entry
#                     before the final: a list of {version, date}, each
#                     version a PEP 440 pre-release of `version` (0.4.0rc1
#                     of 0.4.0). A candidate's tag is v{candidate}; it is
#                     published as a GitHub pre-release built from this
#                     entry's notes, and the entry stays `unreleased` until
#                     the final ships. doc/RELEASING.md walks a release.
#   status            released | unreleased | tagged
#                     `tagged` means the tag exists but no GitHub release
#                     was published for it.
#   stable            A real release rather than a candidate. GitHub's
#                     `prerelease` flag derives from it via
#                     `technoproj-changelog release-check`.
#   latest            Exactly one entry carries `latest: true`; it must be
#                     released, stable and mirrored.
#   mirror            The release mirror carries this tag. `mirror_tags` in
#                     changelog.json is this list, newest first, and the
#                     mirror reads it rather than GitHub's release list.
#                     Only a `released` entry may set it.
#   api_version       The schema era stamped into PRAGMA user_version
#                     (aloelite/db.py SCHEMA_ERA). A file written by one era
#                     opens on a build of that era; a NEWER era is refused
#                     rather than half-read, so a bump here is a hard break
#                     and belongs in `upgrading`. Omitted for 0.3.0/0.3.1,
#                     which predate the era stamp (user_version 0).
#   summary           Prose block heading the release.
#   upgrading         Optional. Anything a user must do to move to it.
#   known_issues      Optional. Problems present in this version, recorded
#                     against the version they affect rather than only
#                     against the one that fixes them.
#   added / changed / deprecated / removed / fixed / security
#                     The keepachangelog sections. Omit what is empty.
#
# `planned` is separate from `releases` on purpose: an entry under `releases`
# claims the code is in this tree, and `technoproj-changelog consistency` checks
# the newest one against pyproject.toml, .technoproj and db.py. Work that is
# real but still on a branch goes under `planned`, which makes no such claim.
#
# A note on the tag history: v0.3.1 was tagged 2026-07-25, and v0.3.1rc1
# through v0.3.1rc4 were tagged AFTER it (2026-07-27 .. 2026-08-03). Those
# four candidates are what became 0.3.2, despite their names. They are rolled
# into the 0.3.2 entry rather than given entries that would imply they
# preceded 0.3.1.

schema: 1
repo: Aloecraft-org/aloelite

planned: []

releases:
  - version: "0.5.0"
    date: null
    status: unreleased
    stable: false
    api_version: 3
    summary: |
      **The Mount API dispatch is a crate of its own.** `aloelite-wasm` held
      the only copy of the table that maps the spec's operation names onto
      `aloelite_core::ops`, and it was typed on `JsValue` from end to end. A
      second frontend would have had to copy it, and two copies of the spec
      surface with nothing holding them together is the one thing this tree
      has consistently refused. The table, the argument coercions and the
      dispatch now live in `aloelite-api`, generic over the value type a
      frontend speaks. The browser is its first implementation, and the
      second is an Extism plug-in: the engine in a WebAssembly sandbox,
      callable from any language with an Extism SDK, with the volume on a
      host path the manifest grants.
    added:
      - |
        **New crate: `aloelite-extism`, Aloelite as an Extism plug-in.**
        Seven exports -- `fs_open`, `fs_open_memory`, `fs_open_image`,
        `fs_snapshot`, `fs_call`, `fs_close`, `fs_operations` -- over
        MessagePack, dispatching the same `aloelite-api` table the browser
        does. A host in Go, Python, Ruby, PHP, Java, C# or anything else with
        an Extism SDK gets the Mount API without a binding written for its
        language, and gets it inside a sandbox that reaches exactly the paths
        the manifest names.

        The target is `wasm32-wasip1`, the fourth this workspace builds for,
        and it is Extism's constraint rather than a preference: its runtime
        instantiates core modules over wasmtime's preview-1 layer and cannot
        load a component, which is what `wasm32-wasip2` produces. Preview 1
        also supplies the clock and the CSPRNG the engine asks for, so
        nothing is threaded in as a host function. CI builds the plug-in and
        runs it under a real Extism host.
      - |
        **Two storage shapes, and the second grants the plug-in nothing.**
        The volume is a file on a path the manifest allows, or it is bytes:
        `fs_open_image` takes the whole database and `fs_snapshot` hands it
        back, so a host can keep a volume in S3, a key/value store, a
        Postgres column or a field it already encrypts. An instance in that
        shape is given no `allowed_paths` at all -- the sandbox is complete
        and the plug-in reads nothing it was not handed.

        It goes through the call boundary rather than through Extism host
        functions on purpose: host functions must be registered per language
        and are the roughest corner of several SDKs, while an argument and a
        return value are the one thing every SDK does well. The costs are the
        memory-image model's usual ones and belong to the host: the volume
        must fit in plug-in memory, and durability is per snapshot, so an
        unsnapshotted write is a lost write.
      - |
        **The wire is MessagePack, for the reason the browser's integers are
        `BigInt`.** JSON has no integer type distinct from a double and no
        binary type: bytes would travel base64'd, and a nanosecond timestamp
        -- around 2^60, where a double's spacing is 256 ns -- would come back
        rounded by any host that parses into a double. MessagePack has
        `int64` and `bin`, and the writer is `rmp-serde`'s `to_vec_named`,
        byte-identical to Python's `msgpack.packb(use_bin_type=True)`.

        Errors travel in the payload as `{error: {code, message}}` rather
        than through Extism's error channel, which carries only a string:
        the spec's error is a code, and a code glued to a message is not one.
        Every export succeeds at the Extism level, including the ones that
        failed, which a host has to be told.
      - |
        **`extism` is a frontend in the benchmark harness.** The
        `throughput`, `smallfile`, `random` and `append` suites report it
        beside `direct` on the same corpora with the same barrier, so the gap
        between those two rows is what the WebAssembly sandbox costs and
        nothing else. It drops out silently when the plug-in has not been
        built for `wasm32-wasip1` or the host SDK is absent, the same way
        `rust-fuse` does without `cargo build`.

        Two of its rows' properties are the shape rather than the run, and
        `doc/BENCHMARKS.md` says so where the numbers are: SQLite falls back
        from WAL to a rollback journal (WAL wants shared memory WASI cannot
        offer), and a cold read discards the whole plug-in instance, since
        its page cache lives in linear memory. That second one costs a
        re-mount, because an encrypted volume's key is connection state
        (ENC-3) -- one Argon2id, outside every timed region.
      - |
        **Two things a host must get right, both learned the hard way.**
        Plug-in memory must be at least 96 MiB: Argon2id at the format's
        pinned 64 MiB runs inside the sandbox once per `create_volume` and
        once per `mount`, and a 64 MiB cap fails as `oom`, which reads like a
        bug in the plug-in and is not one. And a mount row is durable, so an
        rw mount left behind by a closed instance meets the next one as
        `mount_conflict`. `rust/aloelite-extism/README.md` is the host
        author's page.
    changed:
      - |
        **Release artifacts carry no version, and the checksum manifest is
        `SHA256SUMS.txt`.** Both from `doc/ALIGNMENT.md`, the Aloecraft-wide
        standard this repository is moving to. The mirror materialises
        `latest/` as a symlink to the tag directory, so a versioned filename
        means no download URL that stays put, and the mirror looks for the
        manifest by name -- that missing extension was the only reason
        aloelite's mirror was switched off.

        Names follow a fixed platform vocabulary rather than Rust triples:
        `aloelite-0.4.0-x86_64-unknown-linux-gnu.tar.gz` becomes
        `aloelite_linux_x86_64_gnu`, a bare binary. The arch token is
        `arm64` on every platform, Linux included -- the vocabulary is ours
        rather than the toolchain's, which is the whole reason for not using
        triples. Each platform ships its binaries separately -- the CLI, and
        `aloelite_fuse_*` where the daemon builds -- plus one
        `aloelite_complete_<platform>` archive carrying everything built for
        it and `BUILDINFO.txt`. `complete` is a reserved component name, so
        it sits in the second field rather than trailing as a profile. The
        wasm leaves are `aloelite_wasi.wasm` and `aloelite_web.tar.gz`. The
        wheel and sdist keep their versioned names, which PyPI mandates.

        Nothing published is renamed: 0.3.7's assets stay as they are, and
        0.4.0 published none.
      - |
        **The release tooling is `technoproj`, not a copy of it.**
        `script/changelog.py` -- 576 lines here, and 423 and 484 in two
        sibling repositories, one tool copied twice and then drifted -- is
        gone. What replaces it is
        [Aloecraft-org/technoproj](https://github.com/Aloecraft-org/technoproj),
        installed in CI and pinned to a commit.

        The divergence between the three copies turned out to be a schema and
        a fact table rather than logic, so what is aloelite's now lives in
        `.technoproj`'s `TECHNO_CHANGELOG` block -- the project name, the
        `schema era` fact, the keys an entry must carry, the candidate and
        planned sections, and a stamp for `rust/Cargo.toml`. The acceptance
        bar was byte-for-byte reproduction of the committed `CHANGELOG.md`,
        and it holds: the whole diff is the one intended line, the preamble
        naming `technoproj-changelog generate` instead of the old path.

        `script/version.mk` is still a copy, because `make` must read it with
        no network and no virtualenv -- but `technoproj sync` places it and
        `technoproj check` now runs in CI, so it is a copy that is checked
        rather than one that is trusted. That is the whole difference between
        this and the three forks it replaces.
      - |
        **The mirror reads `changelog.json`, and this tree commits it.**
        `emit_json: true`. A mirror can source a project from GitHub's
        release list or from its changelog, and aloelite's is the changelog
        now: the mirror host runs a stdlib-only Python with no build step,
        so it reads the JSON rather than parsing Markdown or asking an API.
        Each entry carries its rendered notes, so the mirror needs no
        renderer of its own. `technoproj-changelog check` runs in CI and is
        what stops the committed copy going stale.

        Which tags it carries is a per-entry `mirror: true`, not every
        release: the 0.3.x tags published to PyPI and cut no GitHub release
        at all, so there is nothing under them to mirror. 0.4.0 is the first
        and so far only entry marked, and `latest_requires` now names
        `mirror` alongside `stable`, so the newest release cannot claim
        `latest` without the question having been answered.
      - |
        **The one invariant that does not generalise moved to
        `script/checks.py`.** The engine calls it if it exists. For aloelite
        it is `SCHEMA_ERA` in `aloelite/db.py` against the era the newest
        entry claims -- the field that decides whether a volume someone
        already has still opens, and the reason `ALIGNMENT.md` insists
        compatibility is checked by name rather than by reading digits out of
        a version.
      - |
        **A `-dev.<n>` tag can never reach PyPI.** `publish.yml` now ignores
        `v*-dev.*`. Nothing cuts a dev tag yet, and that is the point:
        `0.5.0-dev.7` normalises to the perfectly valid PEP 440 version
        `0.5.0.dev7` and would have uploaded without complaint, and a PyPI
        upload can be yanked but never replaced or reused. Pruning works on
        GitHub releases and does not work there, so the exclusion has to land
        before the first dev tag rather than after.
      - |
        **`BUILDINFO.txt` ships with every release**, and travels inside each
        `complete` archive so someone who unpacked one can still read what
        they have. It carries what `.technoproj` cannot -- committing the
        file would change the commit it claims -- and what a filename must
        not: tag, version, the PEP 440 spelling, commit, branch, build time,
        and `schema_era`.

        That last one is the point of the file rather than a detail. It is
        the fact a consumer has to check, because it decides whether an
        existing volume opens, and `ALIGNMENT.md` is explicit that
        compatibility is verified by named field and never by reading digits
        out of a version. The `branch` line is derived from which remote
        branch contains the commit, since a tag push carries no branch at
        all.
      - |
        **Releasing gates on the tests.** `release.yml`'s builds ran in
        parallel with `main.yml`'s matrix on the same commit -- two
        independent workflow runs with nothing connecting them -- so pushing
        a tag published whether or not the tests passed, and you found out
        afterwards. A `gate` job is now that connection: it waits for a
        successful `main.yml` run on the same SHA, and the two jobs that
        publish anything (`image`, which pushes to GHCR itself, and
        `release`) wait for it.

        The build matrix does not, so the gate costs no wall clock on the
        slow half -- and usually none at all, since a commit is pushed to
        main and tested before it is tagged, which means a green run on that
        SHA already exists. A dry run no-ops it and a `-dev.<n>` build is
        exempt, which is what that suffix is for.
      - |
        **`.technoproj` says `pre` where it said `build`.** `null` for a
        release, `{"kind": "rc", "n": 1}` for a candidate. The old field
        meant three different things in three repositories and was typed two
        ways; this one has a single meaning and a defined spelling in each
        ecosystem.

        `script/version.mk` derives all three from it -- `0.5.0rc1` for
        PyPI, `0.5.0-rc.1` for Cargo, `v0.5.0-rc.1` for the tag -- so there
        is no second definition of any of them, and `make echo` prints what
        you are about to stamp. `make pre_set KIND=rc N=1`, `make pre_bump`
        and `make pre_clear` replace `make inc_build`. The Makefile's own
        second jq expression for the image tag is gone with it.

        `changelog.py consistency` now holds `pre` against `pyproject.toml`,
        so the field cannot drift from what it describes, and candidate tags
        resolve under both `vX.Y.Z-rc.N` and the legacy `vX.Y.ZrcN` -- new
        candidates use the first, already-pushed tags keep working.

        The **tag body** is the canonical spelling: it is what
        `CHANGELOG.yaml` and `rust/Cargo.toml` hold, and PEP 440 is derived
        from it for `pyproject.toml` and PyPI alone. `semver_to_pep440` is
        that derivation and round-trips against `pep440_to_semver` for all
        five kinds. `version.mk`'s `_sync_version` target is gone rather than
        fixed: it wrote `.package.version`, a Cargo path, so in this
        repository it would have added a bogus `[package]` table and left
        `[project].version` stale. What replaces it is the check that already
        exists -- stamping is a human edit a gate catches, not a target that
        rewrites a manifest.
      - |
        **New crate: `aloelite-api`, the Mount API dispatched by name.** It
        holds `OPS` (the spec's operations and their parameter names, as
        data), the coercions that turn named arguments into the engine's
        types, and `Handle` -- the engine plus its open streaming
        descriptors, with `call(op, args)` over both. Like `aloelite-core`
        it performs no I/O, names no platform and carries no `cfg`, so it
        compiles for native, `wasm32-wasip2` and `wasm32-unknown-unknown`
        alike; CI checks all three.

        A frontend supplies two traits over its own value type -- `Value`
        for an argument (six questions, each answered `Option`) and
        `Surface` for the pair of value types -- and gets every operation.
        It cannot get half of them, and two frontends cannot disagree about
        what `create_volume` takes.
      - |
        **`aloelite-wasm` is now only the browser's half of that.** The
        `Fs` class, the `postMessage` server and the OPFS pool are
        unchanged; what left is the 600 lines of dispatch and the 300 of
        argument reading. What stayed is what is genuinely about
        JavaScript: `JsSurface` (records as objects, every integer a
        `BigInt`, bytes as `Uint8Array`), `JsArg` (a `Number` or a `BigInt`
        is an integer; a `Uint8Array`, `ArrayBuffer` or string is bytes;
        `undefined` is absent and `null` is present-and-empty), and the
        `Error` with a `code` that a failure throws.

        The ES module's surface is identical, down to the error messages:
        the strings that named JavaScript's own vocabulary ("a safe Number
        or a BigInt") are associated constants on the trait, so they follow
        the frontend rather than the dispatch.
      - |
        **Exports are prefixed `fs_`, because a wasm export is a symbol.** An
        export named `open` collides with wasi-libc's and the linker refuses
        the module, which is the harmless case. An export named `close` wins
        instead: the linker never pulls libc's, SQLite reaches the platform
        through a table of function pointers, and the first directory sync
        calls `osClose(fd)` through a function that takes no arguments. What
        that produces is `wasm trap: indirect call type mismatch`, four
        frames inside SQLite, nowhere near the export that caused it.

        Nothing on the plug-in's own side of the ABI could have found this,
        which is why `aloelite-extism/harness/` exists and why CI runs it: a
        small Extism host that loads the built `.wasm` and drives a real
        workload through it. It is a separate workspace, since the host SDK
        brings wasmtime and `cargo test` on the engine should not have to
        build a WebAssembly runtime.
      - |
        **The projection test moved with the table it guards.** It holds
        `OPS` against `mount-api.yaml` in both directions -- every declared
        operation dispatched with exactly the spec's parameter names, and
        nothing dispatched the spec does not declare -- and now does it for
        every frontend at once rather than for the browser's copy. It still
        runs in headless Firefox as well as natively; the browser surface
        keeps its own test for the three error codes (`busy`, `opfs`, `io`)
        that are its alone.
  - version: "0.4.0"
    date: 2026-09-12
    status: released
    stable: true
    latest: true
    mirror: true
    candidates:
      - version: "0.4.0rc1"
        date: "2026-09-03"
      - version: "0.4.0rc2"
        date: "2026-09-12"
    api_version: 3
    summary: |
      **Schema era 3: the break-once release.** A file written by this build
      does not open on an older one, by design — `PRAGMA user_version` is 3
      and a newer era is refused rather than half-read. The first open of an
      older file migrates it in place, crash-idempotently, with no other
      table data touched: era 1 -> 2 adds columns and rescales milliseconds
      to nanoseconds, era 2 -> 3 materialises every placement's name.

      This is where the POSIX surface became real (ownership, hardlinks,
      xattrs, fifos), where id generation moved out of SQL and into the host,
      and where the cross-implementation contract grew teeth: the conformance
      suite, the id and format vectors, and a spec that is asserted against
      the implementation rather than describing it. Alongside it, a second
      implementation — `rust/`, six crates on three targets — and the
      benchmark suite that measures the two against each other and against
      ext4.

      Era 3 itself is one change with one purpose: directory operations no
      longer get slower as directories get larger. Lookup was linear and
      listing quadratic; both are now flat and linear respectively, which
      took a schema change (`edge.name`, below), a view rewrite, and a fix
      in both FUSE daemons.
    upgrading: |
      **Timestamps are nanoseconds, not milliseconds** (NODE-4). Anything
      that renders an engine timestamp must divide by 1e9. This is the one
      change that breaks code which never mentions it: three frontends have
      been caught dividing by 1000 and rendering the year 56,672,999.

      **Era-3 files do not open on 0.3.x builds, nor on 0.4.0rc1**, which
      shipped era 2. Opening an era-1 or era-2 file with this build migrates
      it in place and there is no way back; export first if you need to keep
      reading it with an older build.

      **`edge.name` is now always populated** (era 3). It arrived in era 2 as
      a D-5 placement-name override where NULL meant "use the node's name",
      and anything reading the table directly matched on
      `coalesce(edge.name, node.name)`. It now always holds the placement's
      name, and `edge_guard_name` refuses a NULL on insert. Code that reads
      `edge` through the templates or either implementation needs no change;
      code that hand-wrote that coalesce can drop it.
    added:
      - |
        **`bench/` — a measurement suite, and a CI job that publishes it.**
        Nineteen suites across four axes: frontend (`ext4` baseline, the
        library, both FUSE daemons, both `aloelite` binaries), volume mode
        (plain / convergent / random), cache state, and size. Every row
        carries all four labels, because a throughput number without them is
        unattributable. It covers throughput, small-file ops, random `pread`,
        append latency, on-disk-over-logical for three corpus shapes, dedup
        within and ACROSS volumes (which is where per-volume key separation
        gets confirmed rather than asserted), bytes per version, prune vs
        VACUUM, ingest against chunk-table depth, lookup and readdir against
        directory size, peak RSS, unlock/change_pin/verify/export/snapshot,
        reader-writer contention with SQLITE_BUSY accounting, and a `kill -9`
        loop. `gocryptfs` and `restic` appear as outside comparators, and
        `interop` writes a volume with one implementation and reads it back
        with the other. Nothing asserts: the job fails when a suite crashes,
        never on a slow number. `doc/BENCHMARKS.md` records the method, the
        findings, and what it deliberately does not measure.
      - |
        **Pack format v2 (D-8).** A pack now carries each node's uid, gid and
        mode, its xattrs, and its retention policy, so a pack/unpack cycle no
        longer silently strips the permissions FUSE set. v1 packs remain
        readable forever and a pack from a newer build is refused rather
        than half-read. Not carried, by decision: atime, ctime, and hardlink
        identity (each placement restores as its own node). The codec lives
        in `aloelite/pack.py` and is pinned byte-for-byte by
        `conformance/vectors/pack-v2.json` (writer) and `pack-v1.json`
        (reader), generated by `script/gen_pack_vectors.py` and run by the
        Python and Rust suites; `scenarios/pack.yaml` pins the round trip.
      - |
        **Spec: encryption parameters.** `mount-api.yaml` now declares
        `chunk_size`, `pin` and `enc_mode` on `create_volume`, `pin` on
        `mount`, and the `bad_key` / `encryption_required` outcomes on
        `mount` and `change_pin` — what the reference has taken since ENC-2
        shipped, and what a port needs to run the encryption harnesses.
      - |
        **`rust/` — the Rust workspace.** Six crates on three targets (native,
        `wasm32-wasip2`, `wasm32-unknown-unknown`). `aloelite-core` compiles to
        every target with zero `cfg`, and a CI job enforces that on every push
        — including running the conformance suite in a headless browser.
        `aloelite-core` implements the whole Mount API — schema and era
        migration, the sixty-four templates as compile-time constants, the id
        mint (D-1/D-2), the ENC-2 ladder, resolution, the streaming
        descriptor, and every operation function-for-function with
        `operations.py` — and passes all 94 conformance scenarios and every
        vector natively and in a headless browser. `doc/RUST_PORT.md` is the plan; D-7 is the storage
        decision.
      - |
        **`aloelite-store`: how a connection is opened, per target.** Three
        openers, each returning the same engine handle: a file path (native
        and WASI, durability per transaction), a memory image loaded from and
        checkpointed back to one `BlobStore` blob (every target; durability
        per explicit `checkpoint()` / `close()`, never on a timer, and a
        snapshot is refused inside a transaction), and the browser's OPFS
        pool from a Dedicated Worker, with export, import and delete. It is
        the one crate in the port where `cfg` is allowed. Tested natively, in
        a browser, and in a dedicated worker; D-7 records why there is no
        trait over the three.
      - |
        **`aloelite-wasm`: the browser surface.** `Fs.call(op, args)` runs
        any Mount API operation by its spec name with the spec's parameter
        names; `serve(fs, self)` turns that into the Worker protocol
        (`{id, op, args}` in, `{id, ok}` or `{id, error: {code, message}}`
        out); `Pool.install` / `Pool.open(name)` is the OPFS pool, and
        `open` takes the Web Lock that makes a volume file single-writer
        (`busy` when another Worker has it, never a silent wait). One
        dispatch table, held against `mount-api.yaml` in both directions by
        test. Integers cross as `BigInt` — timestamps are nanoseconds and do
        not fit a double — and bytes as `Uint8Array`. CI runs the tests
        under Firefox and packages the ES module with `wasm-bindgen`.
      - |
        **`aloelite-fuse`: the Linux FUSE daemon.** A port of
        `aloelite/fuse.py` over `fuser`, handler for handler, including the
        write-handle model that keeps a second fd coherent with unflushed
        writes (the shared per-inode dirty-extent overlay). `doc/COMPATIBILITY.md`
        is re-established against a live kernel mount by
        `rust/aloelite-fuse/tests/mount.rs`: hardlinks, symlinks, fifos,
        `user.*` xattrs, real ownership and nanosecond times, sparse writes,
        and device-node refusal (D-3). POSIX locks stay kernel-arbitrated per
        mount, as in the reference; the cross-mount upgrade is D-4. CI
        installs `fuse3` and runs the mount tests on every push.
      - |
        **`aloelite-cli`, and a contract for the command.** The `aloelite`
        command in Rust, verb for verb with `aloelite/cli.py`: the same
        fifteen verbs, globals, flags, output lines and exit codes, `put -r`
        / `get -r`, the three PIN sources with a terminal prompt. Porting it
        wrote the contract the CLI never had, `aloelite/config/cli.yaml`,
        which `tests/test_cli_contract.py` (Python argparse) and
        `rust/aloelite-cli/tests/contract.rs` (Rust verb table) now project
        onto in both directions — a verb or a flag cannot exist in one
        implementation alone; the file lists the few places the two
        legitimately read differently. The Rust command also builds for
        `wasm32-wasip2` and runs under wasmtime with the volume on a
        preopened host directory; CI drives it there. With this the six
        crates of the port are complete (D-7).
      - |
        **Releases are built by an action.** Pushing a `v*` tag now produces
        the GitHub release itself: the Python wheel and sdist, `aloelite`
        and `aloelite-fuse` for Linux (x86_64 glibc and musl, aarch64),
        `aloelite` for macOS (both architectures) and Windows, the WASI
        component, the browser package, a `SHA256SUMS`, and the container
        image on GHCR — with the release notes rendered from this file and
        the pre-release flag derived from it. A candidate tag (`v0.4.0rc1`)
        is recorded here under its entry's `candidates` rather than as an
        entry of its own. `doc/RELEASING.md` walks a release end to end; the
        existing PyPI publish is unchanged and still runs on the same tag.
      - |
        **Real POSIX metadata.** `uid`/`gid`/`mode` columns, `atime`/`ctime`,
        `link` (hardlinks, with `nlink` derived from active placements rather
        than stored), `mknod` for fifos and sockets, symlinks as a first-class
        node type, and `user.*` xattrs. Device nodes are refused by decision
        (D-3), not by omission.
      - |
        **Host-minted ids (D-1/D-2).** Node and edge ids come from a per-mount
        monotonic uuid7 mint fenced by the volume's high-water mark, replacing
        SQL trigger minting. This removes the `MAX(uuid7)` read-back and with
        it the single-owning-connection model, and it makes id generation one
        unit-testable function per language instead of one per SQL dialect.
      - |
        **Mount access policy (D-4).** Mounts carry `ro`/`rw` and an optional
        principal; by default at most one `rw` mount covers a subtree, with
        overlap an explicit opt-in. Authorization layered above correctness,
        not a correctness invariant.
      - |
        **The conformance suite is the port contract.** 94 language-agnostic
        scenarios plus byte vectors for the id mint and the encryption ladder.
        `tests/test_spec_projection.py` asserts the Python surface against
        `mount-api.yaml` in both directions, including each operation's
        `locks` flag, so an operation can no longer inherit a lock decision by
        omission.
    changed:
      - |
        **`edge.name` always holds the placement's name (era 3).** It arrived
        in era 2 as an override where NULL meant "use the node's name", so
        every lookup matched on `coalesce(edge.name, node.name)` — a
        predicate spanning two tables, which no index can serve. Finding a
        child by name therefore scanned the container and `stat` was linear
        in directory size. `create_edge` now materialises the node's name
        when the caller gives no override, moving that coalesce from every
        read onto one write, and `edge (from_id, name, to_id) WHERE
        archived = 0` answers the lookup from the index alone. At 10,000
        entries `stat` goes 6.32 ms -> 0.063 ms and stops growing; against
        ext4 on the same disk the gap falls from 1,170x to 12x. The index's
        write cost did not show above run-to-run noise. `migrate_to_era3`
        backfills, idempotent by its own WHERE; `edge_guard_name` keeps it
        true; a genuine D-5 override is left alone.
      - |
        **Listing visibility is a window, not a correlated subquery.** NODE-5
        makes the greatest `node_id` per effective name visible, and
        `directory_listing` derived that per row by re-reading the whole
        child set — O(N^2). As `max(...) OVER (PARTITION BY ...)` it is one
        pass: a 10,000-entry `readdir` goes 51.0 s -> 93 ms, and the shape
        changes rather than the constant, so the gap widens with N. Output is
        byte-identical, held to that against a row-for-row differential over
        hardlinked placements and hidden same-name siblings. A view is not an
        index, so writes are untouched.
      - |
        **All stored timestamps are nanoseconds** (see Upgrading). The era-1
        rescale is bounded by magnitude and is safe to re-run after a crash.
      - |
        **`pack`'s `ver` field is now a gate.** A blob from a newer build is
        refused with `unsupported` instead of being read with this build's
        field set and silently losing whatever the new version added; a blob
        with no usable version is `corrupt`. Older versions stay readable.
      - |
        **PI-1 narrowed to containers.** Non-container leaves may hold several
        active placements, which is what makes hardlinks possible; the
        container graph is still a tree.
    fixed:
      - |
        **Both FUSE daemons rebuilt the directory listing on every kernel
        `readdir` call.** The kernel reads a directory in buffer-sized
        instalments, so a scan cost one full listing per call — on top of a
        listing that was itself quadratic, which made a scan through a mount
        close to cubic. `opendir` now snapshots the listing, `readdir` serves
        every instalment from it, and `releasedir` drops it, in both the
        Python and Rust daemons. A 5,000-entry `readdir` went 328 s -> 12.8 s
        (Python) and 88 s -> 11.5 s (Rust) before the view rewrite above took
        both to tens of milliseconds. The snapshot also makes the offset
        cookies stable, which they never were: against a freshly built
        listing, an entry created or removed mid-scan shifted every cookie
        after it and the kernel could skip or repeat entries.
      - |
        `unpack` answers `corrupt` for a garbage or malformed pack blob (bad
        MsgPack, a top-level array, a node without a type) instead of
        escaping a raw decoder exception.
      - |
        Mounting or resolving a volume BY NAME with duplicates now picks the
        most recently created volume (`created_at`, then id). It picked the
        greatest id, and volume ids are stateless uuid7s (D-1: no ordering
        promise), so two same-named volumes created inside one millisecond
        resolved by their random bits — a coin flip `test_path.py` lost on a
        fast CI runner.
      - |
        **Locks guard placement, not just content (ACC-11, D-6).** `rename`
        and `link` were outside the excluded set, so a same-directory `mv`
        from another mount walked past a lock that a cross-directory `mv`
        honoured — and a WebDAV client holding a LOCK could have its next PUT
        land in a different node with no error anywhere. `pack` and `unpack`
        joined the set too. What a lock deliberately does NOT exclude —
        ownership, times, xattrs, `copy` — is now recorded and pinned as
        conformance data alongside what it does.
      - |
        **`copy` and `pack` name each placement, not each node.** A subtree
        walk enumerates placements, and a hardlinked node may be named
        differently at each one. Reading the node's own name gave every
        placement the same name, so the copies collided and NODE-5 hid all but
        one — a copy containing fewer visible files than its source, silently.

  - version: "0.3.7"
    date: 2026-08-31
    status: released
    stable: true
    api_version: 1
    summary: |
      **An S3 frontend, scoped to what a replication client actually calls.**
      Enough of S3 for a backup tool to ship to an aloelite volume alongside
      the AWS bucket it already uses, and no more. Off by default, like
      WebDAV, and one step stricter: enabled without credentials is a startup
      error rather than an endpoint that authenticates nobody.

      The surface was derived by reading litestream 0.3.13's S3 replica
      client rather than the S3 API docs, which is why it is small -- and why
      two of its shapes are not the ones an API summary would suggest.
    added:
      - |
        **S3 frontend (`ALOELITE_S3`), bucket = volume.** ListObjects,
        GetObject, PutObject, multipart upload, and batch DeleteObjects,
        served at the application root so a client's `endpoint` needs no path
        component. Buckets are volumes created through the manager's own API;
        there is no CreateBucket, the same posture WebDAV takes toward
        volumes.
      - |
        **`ListObjects` is V1, not V2.** The target client paginates with
        `Marker`/`NextMarker`, not a continuation token, and groups
        generations through `CommonPrefixes` with `delimiter=/`. A V2-only
        implementation would leave it unable to enumerate a single
        generation. Listings are sorted lexicographically because S3 promises
        that and aloelite's own listing order is canonical (edge_id,
        node_id), not alphabetical.
      - |
        **Multipart upload, which is not optional.** Every write in that
        client goes through `s3manager.Uploader`, whose default part size is
        5 MiB: WAL segments land as a single PutObject, but any snapshot
        past that becomes a real multipart upload with up to five concurrent
        UploadPart requests. Parts stage in memory and are concatenated at
        Complete, with the staging cap enforced rather than discovered.
      - |
        **SigV4 verification (`manager/sigv4.py`)**, cross-checked against
        botocore's own signer rather than against vectors of our own: the
        tests sign with botocore and verify with this module, so a
        disagreement about canonical form fails the suite. Chunked upload
        signing (`STREAMING-AWS4-HMAC-SHA256-PAYLOAD`) is refused BY NAME
        rather than mis-parsed as a body, because treating the chunk framing
        as content would corrupt the object.
      - |
        **S3 credentials are separate from the volume PIN**, and scopable to
        a set of buckets, so one endpoint can serve several jobs without each
        holding the others' data -- and so a backup job's key cannot unlock
        the volume through every other frontend.
      - "`manager/test_s3.py` drives the frontend with a real botocore client over a real socket. A request signed by our own code would only test the verifier against its own canonicalisation."
      - |
        `script/s3_smoke.py`, which runs the same shape of check against a
        DEPLOYED endpoint rather than a fixture -- the question someone
        standing in front of a new install is actually asking. First run on a
        real Windows host passed all six: put/get, a deep key's implied
        prefixes, flat and delimited listing, a multipart upload past the
        5 MiB part size, and a batch delete."
      - |
        **`doc/WINDOWS.md`**, and the audit behind it. Windows is where the
        WebDAV frontend was aimed and where aloelite has still never run, so
        the manager's startup path was read for POSIX-only assumptions rather
        than assumed clean. `aloelite-web` defaults to direct-only mode, which
        skips every FUSE precondition (`/dev/fuse`, `CAP_SYS_ADMIN`,
        `/proc/self/mountinfo`, `fusermount3`), so those never execute there.
    fixed:
      - |
        **A WebDAV volume can be addressed by NAME, not just by its uuid.**
        `/dav/backups` now resolves as well as
        `/dav/ca678c06bfaa41928ea9d01d45234ee5`. The id is authoritative and
        still tried first, so nothing that worked before resolves differently.
        This was a real usability wall rather than a nicety: a DAV URL is
        typed once into a Map Network Drive dialog and has to be recognised
        later, a 32-hex uuid is neither memorable nor checkable, and the S3
        frontend on the SAME manager already addressed the same volumes by
        name -- the product disagreed with itself. Names are unique only
        within a filesystem, so an ambiguous name is refused with a 409 naming
        the candidate ids rather than resolved to whichever sorts first;
        silently mounting the wrong volume is the worse failure.
      - |
        **The too-old-sqlite message named a fix that does not exist on
        Windows.** It said `pip install 'aloelite[bundled-sqlite]'`, but that
        extra resolves to pysqlite3-binary, which pyproject markers to
        `platform_system == 'Linux'` because it publishes manylinux wheels
        only. On Windows the command installs nothing, reports no error, and
        the next run refuses in exactly the same way -- so the message sent a
        reader round a loop with no exit. The Windows branch now names the
        fixes that exist there (a newer CPython, or replacing `sqlite3.dll`)
        and says the extra will not help.
      - "`aloelite-web --webdav`'s help still described RFC 4918 class 1 and macOS Finder mounting read-only. Class 2 shipped in 0.3.6, and mounting read-write is the whole point of it."
      - "`manager/test_portability.py`'s guard against POSIX-only calls on the startup path did not cover the new `s3.py` and `sigv4.py`, which are on it. Both are now included, and the sqlite message's platform branches are pinned."
      - |
        **A fresh Windows install hit two dead ends in a row.** `pip install`
        puts the console scripts in the interpreter's `Scripts\` directory,
        which is routinely not on PATH, so `aloelite` is "not recognized" --
        and the obvious recovery, `python -m aloelite`, failed too with "'aloelite'
        is a package and cannot be directly executed". `aloelite/__main__.py`
        now makes `python -m aloelite` the console script, sub-tool dispatch
        included (`python -m aloelite web --webdav` starts the manager), and
        `manager/web.py` gains the `__main__` guard it was missing so
        `python -m manager.web` works too. Pinned as subprocess tests, since
        importing a module proves nothing about `-m` dispatch.
      - |
        **`script/windows/Install-AloeliteTasks.ps1`**, which registers the two
        scheduled tasks a rebootable Windows instance needs. Two rather than
        one because they answer to different owners: the manager runs at system
        startup as SYSTEM (backups arrive whether or not anyone is logged in,
        which is also why `-Root` is mandatory -- SYSTEM's profile is not
        yours), while the drive mapping is per-logon-session by construction
        and runs at logon, as the user, unelevated. The mapping waits for
        `/health` before it maps: a remembered mapping is restored at logon
        BEFORE the server is listening, which is exactly how Windows ends up
        with a dead drive marked disconnected. The S3 secret is passed by
        `ALOELITE_S3_SECRET_FILE` so it never enters the task definition.

    known_issues:
      - |
        An ETag here is opaque (`"<id>-<version>"`), not the object's MD5.
        Aloelite's chunk addresses are taken over CIPHERTEXT, and storing a
        plaintext digest beside the ciphertext would hand anyone with file
        access an offline confirmation oracle -- exactly what a volume's
        `random` enc_mode gives up dedup to avoid. Real S3 also returns
        non-MD5 ETags for SSE-KMS and multipart objects, and multipart part
        ETags are round-tripped by the client, so nothing in the target
        client notices. A tool that verifies ETag == MD5 would.
      - |
        Litestream does NOT infer path-style addressing from `endpoint`
        alone: `s3.ParseHost` sets it only for hosts it recognises as a known
        provider, and a bare `s3://bucket/prefix` URL falls through to
        `forcePathStyle = false`. A deployment pointing litestream at this
        frontend must set `force-path-style: true` in its replica block, or
        configure `ALOELITE_S3_VHOST_SUFFIX` and provide wildcard DNS.
      - "Multipart parts stage in memory and are not persisted, so an upload interrupted by a manager restart is abandoned. The client retries the whole object, which is the same outcome it already handles."
      - "A key cannot be both an object and a prefix of other objects. S3's keyspace is flat and permits it; a tree cannot, so it is refused with InvalidRequest rather than resolved arbitrarily."

  - version: "0.3.6"
    date: 2026-08-31
    status: released
    stable: true
    api_version: 1
    summary: |
      **WebDAV, promoted from an assessment to a working frontend.** The
      protocol and engine work is verified here; the desktop-client behaviour
      it targets is not, because CI has no Windows or macOS runner.

      The frontend is off by default. It is a second, write-capable surface on
      every volume, and the one feature that tempts a deployment past
      loopback, so it does not appear by accident.
    added:
      - |
        **WebDAV frontend (`--webdav`), RFC 4918 compliance class 2.**
        LOCK/UNLOCK, Depth 0 and infinity, exclusive write locks, the `If:`
        header, and `lockdiscovery`/`supportedlock` reporting real state.
        Class 2 is what makes Finder mount read-write instead of read-only,
        and what stops the Windows redirector failing at first save.
      - |
        **TLS: `--tls-cert`/`--tls-key`, or `--tls-self-signed`** generated
        once and reused. Serving WebDAV off loopback without TLS is REFUSED,
        not warned about: the Basic password is the volume PIN.
      - |
        **Conditional requests on a strong ETag** built from
        `content.version`. A weak validator can never satisfy `If-Match` or
        `If-Range` (RFC 9110 8.8.3.2 requires strong comparison), so a weak
        etag would have reduced both headers to permanent no-ops.
      - "Engine: `lock`/`unlock`/`renew_lock` make a lock a first-class object that outlives any descriptor."
      - "Engine: `Descriptor.abort()`, plus abort-on-scope-exit, so a failed write discards its staging rather than committing a partial file."
    changed:
      - "Engine locks now guard placement, existence and metadata, not only content (ACC-11)."
      - "`doc/WEBDAV.md` rewritten for class 2, including the correction that engine locks give no DAV-vs-DAV exclusion, because all DAV clients on a volume share one engine mount."
    fixed:
      - |
        **`If-Range` was splicing bytes across a change.** A resumed download
        of a file that had changed mid-transfer spliced the new bytes onto the
        prefix the client already held, producing a corrupt result that no
        error reported. A live corruption path, found by writing the
        conditional-request tests.
      - "`aloelite-web` died with `AttributeError` on Windows before binding a socket (`os.geteuid`) -- on the one platform where WebDAV is the only way in."
    known_issues:
      - "No Windows or macOS runner in CI, so real Finder and Windows-redirector behaviour is untested here. That is what the rc was for."

